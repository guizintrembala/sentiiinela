<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado</title>
</head>
<body>
    <!-- NAVBAR-->
    <header class= "navbar">
        <div class="nav-brand">
            <div class="logo-icon">📦</div>
            <div>
                <h1>Hospital Pro - Almoxarifado</h1>
                <span>Gestão de Entrada e Controle de Estoque</span>
            </div>
        </div>
        <div class="nav-user">
            <span class="user-pill" id="nomeUsuario">📦 Almoxarifado</span>
            <a href="index.html" class="btn-nav">🚪 Sair</a>
        </div>
    </header>

    <div class="container">

        <!-- ALERTA-->
         <div class="alerta-estoque" id="alertaEstoque" style="display: none;">⚠️ 
            <strong>Atenção:</strong> <span id="alertaTexto"></span>
        </div>
    </div>

        <!-- — STATS — -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-icon purple">📦</div>
        <div>
            <div class="stat-value" id="statItens">—</div>
            <div class="stat-label">Tipos Cadastrados</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon green">🟢</div>
        <div>
            <div class="stat-value" id="statok">—</div>
            <div class="stat-label">Estoque Normal</div>
    </div>
    </div>
        <div class="stat-card">
            <div class="stat-icon orange"> </div>
            <div>
            <div class="stat-value" id="statBaixo">-</div>
            <div class="stat-label">Estoque Baixo (MENOR QUE10)</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon red"></div>
        <div>
            <div class="stat-value" id="statZerado">-</div>
            <div class="stat-label">Zerados / Esgotados</div>
        </div>
    </div> 
    </div>

    <!-- MAIN GRID -->
    <div class="main-grid"></div>

    <!-- Coluna Esquerda: Formulário Entrada -->
     <div>
        <div class="card">
            <div class="card-header">
                <h2>Entrada de Medicamentos</h2>
            </div>
            <div class="card-body">
                <!-- Tabs: Novo ou Repor-->
                 <div class="entrada-tabs">
                    <button class="tab-btn active" id="tabNovo" onclick="setTab('novo')">Novo Medicamento</button>
                    <button class="tab-btn" id=""></button>
                 </div>
            </div>
        </div>
     </div>

</div>
    
</body>
</html>
