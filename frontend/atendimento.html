<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atendimento</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /*
      =====================================================
      GARANTE QUE OS CAMPOS POSSAM SER EDITADOS
      =====================================================
    */

    input,
    select,
    textarea {
      pointer-events: auto !important;
      user-select: text !important;
      -webkit-user-select: text !important;
      cursor: text;
    }

    input:disabled,
    input[readonly] {
      cursor: not-allowed;
    }

    #cpf,
    #dataNascimento,
    #telefone,
    #email {
      pointer-events: auto !important;
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    #campoConvenio {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Atendimento</h2>

    <form id="formAtendimento">

      <!-- =================================================
           DADOS PESSOAIS
      ================================================== -->

      <label for="nome">
        Nome Completo
      </label>

      <input
        type="text"
        id="nome"
        name="nome"
        autocomplete="name"
        required
      >


      <label for="cpf">
        CPF
      </label>

      <input
        type="text"
        id="cpf"
        name="cpf"
        placeholder="000.000.000-00"
        maxlength="14"
        inputmode="numeric"
        autocomplete="off"
        required
      >


      <label for="nomeMae">
        Nome da Mãe
      </label>

      <input
        type="text"
        id="nomeMae"
        name="nomeMae"
        autocomplete="off"
        required
      >


      <label for="dataNascimento">
        Data de Nascimento
      </label>

      <input
        type="text"
        id="dataNascimento"
        name="dataNascimento"
        placeholder="DD/MM/AAAA"
        maxlength="10"
        inputmode="numeric"
        autocomplete="bday"
        required
      >


      <label for="estadoCivil">
        Estado Civil
      </label>

      <select
        id="estadoCivil"
        name="estadoCivil"
        required
      >

        <option value="">
          Selecione
        </option>

        <option value="Solteiro">
          Solteiro(a)
        </option>

        <option value="Casado">
          Casado(a)
        </option>

        <option value="Divorciado">
          Divorciado(a)
        </option>

        <option value="Viuvo">
          Viúvo(a)
        </option>

        <option value="Uniao Estavel">
          União Estável
        </option>

      </select>


      <!-- =================================================
           CONTATO
      ================================================== -->

      <label for="contato">
        Contato
      </label>

      <input
        type="text"
        id="contato"
        name="contato"
        placeholder="Ex.: WhatsApp"
        autocomplete="off"
      >


      <label for="telefone">
        Telefone
      </label>

      <input
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="(00) 00000-0000"
        maxlength="15"
        inputmode="tel"
        autocomplete="tel"
        required
      >


      <label for="email">
        E-mail
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="email@exemplo.com"
        autocomplete="email"
      >


      <label for="contatoEmergencia">
        Contato de Emergência
      </label>

      <input
        type="text"
        id="contatoEmergencia"
        name="contatoEmergencia"
        placeholder="Nome e telefone"
        autocomplete="off"
      >


      <!-- =================================================
           ENDEREÇO
      ================================================== -->

      <h3>
        Endereço Completo
      </h3>


      <label for="cep">
        CEP
      </label>

      <input
        type="text"
        id="cep"
        name="cep"
        placeholder="00000-000"
        maxlength="9"
        inputmode="numeric"
        autocomplete="postal-code"
      >


      <label for="logradouro">
        Rua / Logradouro
      </label>

      <input
        type="text"
        id="logradouro"
        name="logradouro"
        autocomplete="street-address"
      >


      <label for="numero">
        Número
      </label>

      <input
        type="text"
        id="numero"
        name="numero"
        autocomplete="off"
      >


      <label for="complemento">
        Complemento
      </label>

      <input
        type="text"
        id="complemento"
        name="complemento"
        autocomplete="off"
      >


      <label for="bairro">
        Bairro
      </label>

      <input
        type="text"
        id="bairro"
        name="bairro"
        autocomplete="address-level3"
      >


      <label for="cidade">
        Cidade
      </label>

      <input
        type="text"
        id="cidade"
        name="cidade"
        autocomplete="address-level2"
      >


      <label for="estado">
        Estado
      </label>

      <input
        type="text"
        id="estado"
        name="estado"
        maxlength="2"
        placeholder="UF"
        autocomplete="address-level1"
      >


      <!-- =================================================
           ATENDIMENTO
      ================================================== -->

      <label for="tipo">
        Tipo de Atendimento
      </label>

      <select
        id="tipo"
        name="tipo"
        required
      >

        <option value="">
          Selecione
        </option>

        <option value="Convenio">
          Convênio
        </option>

        <option value="Particular">
          Particular
        </option>

      </select>


      <!-- =================================================
           CONVÊNIO
      ================================================== -->

      <div id="campoConvenio">

        <label for="convenio">
          Convênio
        </label>

        <input
          type="text"
          id="convenio"
          name="convenio"
          placeholder="Nome do convênio"
          autocomplete="off"
        >

      </div>


      <!-- =================================================
           DOCUMENTO
      ================================================== -->

      <label for="documento">
        Documento / Foto
      </label>

      <input
        type="file"
        id="documento"
        name="documento"
        accept="image/*,.pdf"
      >


      <!-- =================================================
           BOTÃO
      ================================================== -->

      <button type="submit">
        Cadastrar
      </button>

    </form>

  </div>


  <script>

    /*
      =====================================================
      ELEMENTOS
      =====================================================
    */

    const form =
      document.getElementById(
        "formAtendimento"
      );

    const tipo =
      document.getElementById(
        "tipo"
      );

    const campoConvenio =
      document.getElementById(
        "campoConvenio"
      );

    const convenio =
      document.getElementById(
        "convenio"
      );

    const cpf =
      document.getElementById(
        "cpf"
      );

    const dataNascimento =
      document.getElementById(
        "dataNascimento"
      );

    const telefone =
      document.getElementById(
        "telefone"
      );

    const email =
      document.getElementById(
        "email"
      );

    const cep =
      document.getElementById(
        "cep"
      );


    /*
      =====================================================
      GARANTIR CAMPOS HABILITADOS
      =====================================================
    */

    [
      cpf,
      dataNascimento,
      telefone,
      email
    ].forEach(
      campo => {

        campo.removeAttribute(
          "readonly"
        );

        campo.removeAttribute(
          "disabled"
        );

      }
    );


    /*
      =====================================================
      CONTROLE DO CAMPO CONVÊNIO
      =====================================================
    */

    function atualizarConvenio() {

      if (
        tipo.value === "Convenio"
      ) {

        campoConvenio.style.display =
          "block";

        convenio.required =
          true;

      } else {

        campoConvenio.style.display =
          "none";

        convenio.required =
          false;

        convenio.value =
          "";

      }

    }


    tipo.addEventListener(
      "change",
      atualizarConvenio
    );

    atualizarConvenio();


    /*
      =====================================================
      MÁSCARA CPF
      =====================================================
    */

    cpf.addEventListener(
      "input",
      function () {

        let valor =
          this.value
            .replace(/\D/g, "")
            .slice(0, 11);


        if (
          valor.length > 9
        ) {

          valor =
            valor.replace(
              /^(\d{3})(\d{3})(\d{3})(\d{0,2}).*/,
              "$1.$2.$3-$4"
            );

        } else if (
          valor.length > 6
        ) {

          valor =
            valor.replace(
              /^(\d{3})(\d{3})(\d{0,3}).*/,
              "$1.$2.$3"
            );

        } else if (
          valor.length > 3
        ) {

          valor =
            valor.replace(
              /^(\d{3})(\d{0,3}).*/,
              "$1.$2"
            );

        }

        this.value =
          valor;

      }
    );


    /*
      =====================================================
      MÁSCARA DATA DE NASCIMENTO
      =====================================================
    */

    dataNascimento.addEventListener(
      "input",
      function () {

        let valor =
          this.value
            .replace(/\D/g, "")
            .slice(0, 8);


        if (
          valor.length > 4
        ) {

          valor =
            valor.replace(
              /^(\d{2})(\d{2})(\d{0,4}).*/,
              "$1/$2/$3"
            );

        } else if (
          valor.length > 2
        ) {

          valor =
            valor.replace(
              /^(\d{2})(\d{0,2}).*/,
              "$1/$2"
            );

        }


        this.value =
          valor;

      }
    );


    /*
      =====================================================
      MÁSCARA TELEFONE
      =====================================================
    */

    telefone.addEventListener(
      "input",
      function () {

        let valor =
          this.value
            .replace(/\D/g, "")
            .slice(0, 11);


        if (
          valor.length > 10
        ) {

          valor =
            valor.replace(
              /^(\d{2})(\d{5})(\d{4}).*/,
              "($1) $2-$3"
            );

        } else if (
          valor.length > 6
        ) {

          valor =
            valor.replace(
              /^(\d{2})(\d{4})(\d{0,4}).*/,
              "($1) $2-$3"
            );

        } else if (
          valor.length > 2
        ) {

          valor =
            valor.replace(
              /^(\d{2})(\d{0,5}).*/,
              "($1) $2"
            );

        }


        this.value =
          valor;

      }
    );


    /*
      =====================================================
      MÁSCARA CEP
      =====================================================
    */

    cep.addEventListener(
      "input",
      function () {

        let valor =
          this.value
            .replace(/\D/g, "")
            .slice(0, 8);


        if (
          valor.length > 5
        ) {

          valor =
            valor.substring(0, 5)
            + "-"
            + valor.substring(5);

        }


        this.value =
          valor;

      }
    );


    /*
      =====================================================
      E-MAIL
      =====================================================
      
      Não aplicamos nenhuma máscara.
      O usuário pode digitar normalmente.
    */


    /*
      =====================================================
      SUBMIT
      =====================================================
    */

    form.addEventListener(
      "submit",
      cadastrar
    );


    async function cadastrar(event) {

      event.preventDefault();


      /*
        PEGA O ARQUIVO
      */

      const arquivo =
        document
          .getElementById("documento")
          .files[0];


      /*
        CRIA FORMDATA
      */

      const formData =
        new FormData();


      /*
        DADOS PESSOAIS
      */

      formData.append(
        "nome",
        document
          .getElementById("nome")
          .value
      );


      formData.append(
        "cpf",
        document
          .getElementById("cpf")
          .value
      );


      formData.append(
        "nomeMae",
        document
          .getElementById("nomeMae")
          .value
      );


      /*
        IMPORTANTE:

        A data agora é enviada
        como DD/MM/AAAA.
      */

      formData.append(
        "dataNascimento",
        document
          .getElementById("dataNascimento")
          .value
      );


      formData.append(
        "estadoCivil",
        document
          .getElementById("estadoCivil")
          .value
      );


      /*
        CONTATO
      */

      formData.append(
        "contato",
        document
          .getElementById("contato")
          .value
      );


      formData.append(
        "telefone",
        document
          .getElementById("telefone")
          .value
      );


      formData.append(
        "email",
        document
          .getElementById("email")
          .value
      );


      formData.append(
        "contatoEmergencia",
        document
          .getElementById("contatoEmergencia")
          .value
      );


      /*
        ENDEREÇO
      */

      formData.append(
        "cep",
        document
          .getElementById("cep")
          .value
      );


      formData.append(
        "logradouro",
        document
          .getElementById("logradouro")
          .value
      );


      formData.append(
        "numero",
        document
          .getElementById("numero")
          .value
      );


      formData.append(
        "complemento",
        document
          .getElementById("complemento")
          .value
      );


      formData.append(
        "bairro",
        document
          .getElementById("bairro")
          .value
      );


      formData.append(
        "cidade",
        document
          .getElementById("cidade")
          .value
      );


      formData.append(
        "estado",
        document
          .getElementById("estado")
          .value
      );


      /*
        ATENDIMENTO
      */

      formData.append(
        "tipo",
        document
          .getElementById("tipo")
          .value
      );


      formData.append(
        "convenio",
        document
          .getElementById("convenio")
          .value
      );


      /*
        ARQUIVO
      */

      if (arquivo) {

        formData.append(
          "documento",
          arquivo
        );

      }


      /*
        ENVIO PARA O BACKEND
      */

      try {

        const resposta =
          await fetch(
            "/atendimento",
            {
              method: "POST",
              body: formData
            }
          );


        let resultado = null;


        try {

          resultado =
            await resposta.json();

        } catch {

          resultado =
            null;

        }


        if (!resposta.ok) {

          throw new Error(
            resultado?.erro ||
            "Erro ao cadastrar atendimento."
          );

        }


        alert(
          "✅ Paciente enviado para triagem!"
        );


        /*
          LIMPA O FORMULÁRIO
        */

        form.reset();


        atualizarConvenio();


      } catch (erro) {

        console.error(
          "Erro:",
          erro
        );


        alert(
          "❌ Não foi possível enviar o paciente para a triagem.\n\n" +
          erro.message
        );

      }

    }

  </script>

</body>

</html>
