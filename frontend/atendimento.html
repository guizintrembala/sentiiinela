```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atendimento</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h2>Atendimento</h2>

    <form id="formAtendimento">

      <!-- DADOS PESSOAIS -->

      <label for="nome">Nome Completo</label>
      <input
        type="text"
        id="nome"
        name="nome"
        required
      >

      <label for="cpf">CPF</label>
      <input
        type="text"
        id="cpf"
        name="cpf"
        placeholder="000.000.000-00"
        maxlength="14"
        required
      >

      <label for="nomeMae">Nome da Mãe</label>
      <input
        type="text"
        id="nomeMae"
        name="nomeMae"
        required
      >

      <label for="dataNascimento">Data de Nascimento</label>
      <input
        type="date"
        id="dataNascimento"
        name="dataNascimento"
        required
      >

      <label for="estadoCivil">Estado Civil</label>
      <select
        id="estadoCivil"
        name="estadoCivil"
        required
      >
        <option value="">Selecione</option>
        <option value="Solteiro">Solteiro(a)</option>
        <option value="Casado">Casado(a)</option>
        <option value="Divorciado">Divorciado(a)</option>
        <option value="Viuvo">Viúvo(a)</option>
        <option value="Uniao Estavel">União Estável</option>
      </select>


      <!-- CONTATO -->

      <label for="contato">Contato</label>
      <input
        type="text"
        id="contato"
        name="contato"
        placeholder="Ex.: WhatsApp"
      >

      <label for="telefone">Telefone</label>
      <input
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="(00) 00000-0000"
        maxlength="15"
        required
      >

      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="email@exemplo.com"
      >

      <label for="contatoEmergencia">
        Contato de Emergência
      </label>

      <input
        type="text"
        id="contatoEmergencia"
        name="contatoEmergencia"
        placeholder="Nome e telefone"
      >


      <!-- ENDEREÇO -->

      <h3>Endereço Completo</h3>

      <label for="cep">CEP</label>
      <input
        type="text"
        id="cep"
        name="cep"
        placeholder="00000-000"
        maxlength="9"
      >

      <label for="logradouro">Rua / Logradouro</label>
      <input
        type="text"
        id="logradouro"
        name="logradouro"
      >

      <label for="numero">Número</label>
      <input
        type="text"
        id="numero"
        name="numero"
      >

      <label for="complemento">Complemento</label>
      <input
        type="text"
        id="complemento"
        name="complemento"
      >

      <label for="bairro">Bairro</label>
      <input
        type="text"
        id="bairro"
        name="bairro"
      >

      <label for="cidade">Cidade</label>
      <input
        type="text"
        id="cidade"
        name="cidade"
      >

      <label for="estado">Estado</label>
      <input
        type="text"
        id="estado"
        name="estado"
        maxlength="2"
        placeholder="UF"
      >


      <!-- ATENDIMENTO -->

      <label for="tipo">Tipo de Atendimento</label>

      <select
        id="tipo"
        name="tipo"
        required
      >
        <option value="">Selecione</option>
        <option value="Convenio">Convênio</option>
        <option value="Particular">Particular</option>
      </select>


      <!-- CONVÊNIO -->

      <div id="campoConvenio">

        <label for="convenio">Convênio</label>

        <input
          type="text"
          id="convenio"
          name="convenio"
          placeholder="Nome do convênio"
        >

      </div>


      <!-- DOCUMENTO -->

      <label for="documento">
        Documento / Foto
      </label>

      <input
        type="file"
        id="documento"
        name="documento"
        accept="image/*,.pdf"
      >


      <!-- BOTÃO -->

      <button type="submit">
        Cadastrar
      </button>

    </form>

  </div>


  <script>

    const form = document.getElementById("formAtendimento");

    const tipo = document.getElementById("tipo");

    const campoConvenio =
      document.getElementById("campoConvenio");

    const convenio =
      document.getElementById("convenio");


    /*
      CONTROLE DO CAMPO CONVÊNIO
    */

    function atualizarConvenio() {

      if (tipo.value === "Convenio") {

        campoConvenio.style.display = "block";

        convenio.required = true;

      } else {

        campoConvenio.style.display = "none";

        convenio.required = false;

        convenio.value = "";

      }

    }

    tipo.addEventListener(
      "change",
      atualizarConvenio
    );

    atualizarConvenio();


    /*
      MÁSCARA CPF
    */

    document
      .getElementById("cpf")
      .addEventListener("input", function () {

        let valor = this.value
          .replace(/\D/g, "")
          .slice(0, 11);

        valor = valor.replace(
          /(\d{3})(\d)/,
          "$1.$2"
        );

        valor = valor.replace(
          /(\d{3})(\d)/,
          "$1.$2"
        );

        valor = valor.replace(
          /(\d{3})(\d{1,2})$/,
          "$1-$2"
        );

        this.value = valor;

      });


    /*
      MÁSCARA CEP
    */

    document
      .getElementById("cep")
      .addEventListener("input", function () {

        let valor = this.value
          .replace(/\D/g, "")
          .slice(0, 8);

        if (valor.length > 5) {

          valor =
            valor.substring(0, 5)
            + "-"
            + valor.substring(5);

        }

        this.value = valor;

      });


    /*
      MÁSCARA TELEFONE
    */

    document
      .getElementById("telefone")
      .addEventListener("input", function () {

        let valor = this.value
          .replace(/\D/g, "")
          .slice(0, 11);

        if (valor.length > 10) {

          valor = valor.replace(
            /^(\d{2})(\d{5})(\d{4}).*/,
            "($1) $2-$3"
          );

        } else if (valor.length > 6) {

          valor = valor.replace(
            /^(\d{2})(\d{4})(\d{0,4}).*/,
            "($1) $2-$3"
          );

        } else if (valor.length > 2) {

          valor = valor.replace(
            /^(\d{2})(\d{0,5}).*/,
            "($1) $2"
          );

        }

        this.value = valor;

      });


    /*
      SUBMIT
    */

    form.addEventListener(
      "submit",
      cadastrar
    );


    async function cadastrar(event) {

      event.preventDefault();


      /*
        PEGA O ARQUIVO
      */

      const arquivo =
        document.getElementById("documento")
          .files[0];


      /*
        CRIA FORMDATA
      */

      const formData = new FormData();


      /*
        DADOS PESSOAIS
      */

      formData.append(
        "nome",
        document.getElementById("nome").value
      );

      formData.append(
        "cpf",
        document.getElementById("cpf").value
      );

      formData.append(
        "nomeMae",
        document.getElementById("nomeMae").value
      );

      formData.append(
        "dataNascimento",
        document.getElementById("dataNascimento").value
      );

      formData.append(
        "estadoCivil",
        document.getElementById("estadoCivil").value
      );

      formData.append(
        "contato",
        document.getElementById("contato").value
      );

      formData.append(
        "telefone",
        document.getElementById("telefone").value
      );

      formData.append(
        "email",
        document.getElementById("email").value
      );

      formData.append(
        "contatoEmergencia",
        document.getElementById("contatoEmergencia").value
      );


      /*
        ENDEREÇO
      */

      formData.append(
        "cep",
        document.getElementById("cep").value
      );

      formData.append(
        "logradouro",
        document.getElementById("logradouro").value
      );

      formData.append(
        "numero",
        document.getElementById("numero").value
      );

      formData.append(
        "complemento",
        document.getElementById("complemento").value
      );

      formData.append(
        "bairro",
        document.getElementById("bairro").value
      );

      formData.append(
        "cidade",
        document.getElementById("cidade").value
      );

      formData.append(
        "estado",
        document.getElementById("estado").value
      );


      /*
        ATENDIMENTO
      */

      formData.append(
        "tipo",
        document.getElementById("tipo").value
      );

      formData.append(
        "convenio",
        document.getElementById("convenio").value
      );


      /*
        ARQUIVO
      */

      if (arquivo) {

        formData.append(
          "documento",
          arquivo
        );

      }


      /*
        ENVIO PARA O BACKEND
      */

      try {

        const resposta = await fetch(
          "/atendimento",
          {
            method: "POST",
            body: formData
          }
        );


        if (!resposta.ok) {

          throw new Error(
            "Erro ao cadastrar atendimento"
          );

        }


        alert(
          "Paciente enviado para triagem!"
        );


        form.reset();

        atualizarConvenio();


      } catch (erro) {

        console.error(
          "Erro:",
          erro
        );

        alert(
          "Não foi possível enviar o paciente para a triagem."
        );

      }

    }

  </script>

</body>

</html>
```
