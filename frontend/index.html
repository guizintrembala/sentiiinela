<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Hosp+</title>
</head>

<body>

    <div class="container">

        <h2>🏥 Hosp+</h2>

        <div class="logo">
            <img src="hospital.png" alt="Hospital">
        </div>

        <input id="usuario" type="text" placeholder="Usuário">

        <input id="senha" type="password" placeholder="Senha">

        <button onclick="login()">Entrar</button>

    </div>

    <script>
        function login() {
            fetch("http://localhost:3000/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    usuario: document.getElementById("usuario").value,
                    senha: document.getElementById("senha").value
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.tipo === "triagem") {
                    location.href = "triagem.html";
                }

                if (data.tipo === "medico") {
                    location.href = "medico.html";
                }

                if (data.tipo === "atendimento") {
                    location.href = "atendimento.html";
                }
            });
        }
    </script>

</body>
</html>
