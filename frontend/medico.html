<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
    }

    .consultorio-input label {
      font-weight: bold;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Botão de alta */
    .btn-alta {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-left: 8px;
    }

    .btn-alta:hover {
      background: #0056b3;
    }

    .botoes-consulta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .botoes-consulta button {
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Painel de Alunos</h1>
        <p>Demonstração de CRUD FrontEnd/Backend (Node.js)</p>
    </header>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="margin:0;">🩺 Painel Médico</h2>

      <button
        class="btn-abrir-tv"
        onclick="window.open('tv.html','_blank')">
        📺 Abrir Tela da TV
      </button>
    </div>

    <div class="consultorio-input">
      <label>Meu Consultório:</label>

      <input
        type="text"
        id="consultorio-num"
        value="01">

      <span style="color:#666; font-size:13px;">
        Este número será exibido na TV ao chamar o paciente.
      </span>
    </div>

    <div id="triagens"></div>

    <hr>

    <h3>Consulta</h3>

    <input
      id="paciente"
      placeholder="Paciente"
      readonly>

    <input
      id="diagnostico"
      placeholder="Diagnóstico">

    <select id="medicacao">
      <option value="">Selecione a medicação</option>
    </select>

    <textarea
      id="obs"
      placeholder="Observações"></textarea>

    <div class="botoes-consulta">

      <button onclick="salvar()">
        💾 Salvar Consulta
      </button>

      <button
        class="btn-alta"
        onclick="darAlta()">
        🏠 Dar Alta e Gerar PDF
      </button>

    </div>

</div>

<script>

let triagensCarregadas = [];

/* =====================================================
   CARREGAR PACIENTES
===================================================== */

function carregar() {

  fetch("/triagens")
    .then(r => r.json())
    .then(data => {

      triagensCarregadas = data;

      const div = document.getElementById("triagens");

      div.innerHTML = "";

      if (data.length === 0) {

        div.innerHTML =
          "<p style='color:#888; text-align:center;'>Nenhum paciente na fila.</p>";

        return;
      }

      data.forEach((t, index) => {

        div.innerHTML += `
          <div class="card">

            <h3>${t.nome}</h3>

            <p>
              <b>Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>

            <p>
              <b>Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>

            <p>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>

            <div style="display:flex; gap:8px; flex-wrap:wrap;">

              <button onclick="selecionar(${index})">
                👨‍⚕️ Atender
              </button>

              <button
                class="btn-tv"
                onclick="chamarNaTV('${t.nome.replace(/'/g, "\\'")}')">
                📺 Chamar na TV
              </button>

            </div>

          </div>
        `;
      });

    })
    .catch(error => {

      console.error("Erro ao carregar triagens:", error);

      alert("Erro ao carregar os pacientes.");

    });
}


/* =====================================================
   CHAMAR PACIENTE NA TV
===================================================== */

function chamarNaTV(nome) {

  const consultorio =
    document.getElementById("consultorio-num").value || "01";

  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      localTipo: "CONSULTÓRIO",

      localNumero: consultorio,

      paciente: nome

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  })

  .catch(error => {

    console.error(error);

    alert("Erro ao chamar paciente na TV.");

  });
}


/* =====================================================
   SELECIONAR PACIENTE
===================================================== */

function selecionar(index) {

  const t = triagensCarregadas[index];

  document.getElementById("paciente").value =
    t.nome;

  document.getElementById("obs").value =
    t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }
}


/* =====================================================
   CARREGAR MEDICAÇÕES
===================================================== */

function carregarMedicacoes() {

  fetch("/lista-medicacoes")

    .then(r => r.json())

    .then(data => {

      const select =
        document.getElementById("medicacao");

      select.innerHTML =
        `<option value="">
          Selecione a medicação
        </option>`;

      data.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;

        option.textContent = med;

        select.appendChild(option);

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar medicações:",
        error
      );

    });
}


/* =====================================================
   SALVAR CONSULTA
===================================================== */

function salvar() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }


  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;
  }


  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })

  .then(r => r.json())

  .then(() => {

    alert("✅ Consulta salva!");

    document.getElementById("diagnostico").value = "";

    document.getElementById("medicacao").value = "";

    document.getElementById("obs").value = "";

  })

  .catch(error => {

    console.error(error);

    alert("Erro ao salvar consulta.");

  });
}


/* =====================================================
   DAR ALTA + GERAR PDF
===================================================== */

function darAlta() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  /* Verifica se existe paciente */

  if (!paciente) {

    alert(
      "⚠️ Primeiro selecione um paciente em 'Atender'."
    );

    return;
  }


  /* Confirmação */

  const confirmar = confirm(
    "Deseja realmente dar alta para " +
    paciente +
    " e gerar o PDF de alta?"
  );


  if (!confirmar) {
    return;
  }


  /* Envia dados para o servidor */

  fetch("/alta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "Erro ao gerar alta."
      );

    }

    return response.blob();

  })

  .then(blob => {

    /*
     * Cria uma URL temporária
     * para o arquivo PDF
     */

    const url =
      window.URL.createObjectURL(blob);


    /*
     * Abre o PDF em uma nova aba
     */

    window.open(url, "_blank");


    /*
     * Limpa o formulário
     */

    document.getElementById("paciente").value = "";

    document.getElementById("diagnostico").value = "";

    document.getElementById("medicacao").value = "";

    document.getElementById("obs").value = "";


    /*
     * Atualiza a fila
     */

    carregar();


    alert(
      "✅ Alta realizada com sucesso!"
    );

  })

  .catch(error => {

    console.error(
      "Erro ao gerar alta:",
      error
    );

    alert(
      "❌ Não foi possível gerar o PDF de alta."
    );

  });

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

carregar();

carregarMedicacoes();


/*
 * Atualiza lista automaticamente
 * a cada 10 segundos
 */

setInterval(carregar, 10000);

</script>

</body>
</html>
