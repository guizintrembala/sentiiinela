<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Médico</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-tv:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
    }

    .consultorio-input label {
      font-weight: bold;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .btn-alta {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-left: 8px;
    }

    .btn-alta:hover {
      background: #0056b3;
    }

    .btn-alta:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .botoes-consulta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .botoes-consulta button {
      cursor: pointer;
    }

    .card {
      margin-bottom: 12px;
    }

    .card-atendimento {
      border: 2px solid #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.25);
    }

    .mensagem-vazia {
      color: #888;
      text-align: center;
      padding: 20px;
    }

    .erro {
      color: #dc3545;
      background: #fff0f0;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #f5c2c7;
    }

    .risco {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Painel Médico</h1>
      <p>Atendimento e gerenciamento de pacientes</p>
    </header>

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      gap:10px;
      flex-wrap:wrap;
    ">

      <h2 style="margin:0;">🩺 Painel Médico</h2>

      <button
        type="button"
        class="btn-abrir-tv"
        onclick="abrirTV()">
        📺 Abrir Tela da TV
      </button>

    </div>

    <!-- CONSULTÓRIO -->

    <div class="consultorio-input">

      <label for="consultorio-num">
        Meu Consultório:
      </label>

      <input
        type="text"
        id="consultorio-num"
        value="01"
        maxlength="2"
        inputmode="numeric"
        autocomplete="off">

      <span style="color:#666; font-size:13px;">
        Este número será exibido na TV ao chamar o paciente.
      </span>

    </div>

    <!-- FILA DE TRIAGEM -->

    <h3>👥 Pacientes aguardando atendimento</h3>

    <div id="triagens"></div>

    <hr>

    <!-- CONSULTA -->

    <h3>🩺 Consulta</h3>

    <input
      id="paciente"
      placeholder="Paciente"
      readonly>

    <input
      id="diagnostico"
      placeholder="Diagnóstico">

    <select id="medicacao">
      <option value="">
        Selecione a medicação
      </option>
    </select>

    <textarea
      id="obs"
      placeholder="Observações"></textarea>

    <div class="botoes-consulta">

      <button
        type="button"
        onclick="salvar()">
        💾 Salvar Consulta
      </button>

      <button
        type="button"
        class="btn-alta"
        id="btn-alta"
        onclick="darAlta()">
        🏠 Dar Alta e Gerar PDF
      </button>

    </div>

  </div>


  <script>

    /* =====================================================
       VARIÁVEIS
    ===================================================== */

    let triagensCarregadas = [];

    let pacienteSelecionado = null;

    let consultaSalvando = false;

    let altaProcessando = false;

    let tvChamando = false;


    /* =====================================================
       FUNÇÃO AUXILIAR
       Escapa HTML para evitar XSS
    ===================================================== */

    function escapeHTML(valor) {

      return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       ABRIR TV
    ===================================================== */

    function abrirTV() {

      window.open(
        "tv.html",
        "_blank"
      );

    }


    /* =====================================================
       VALIDAR CONSULTÓRIO
    ===================================================== */

    function obterConsultorio() {

      let valor =
        document
          .getElementById("consultorio-num")
          .value
          .trim();

      if (!valor) {

        valor = "01";

      }

      /*
       * Permite somente números
       */

      valor = valor.replace(/\D/g, "");

      if (!valor) {

        valor = "01";

      }

      /*
       * Mantém dois dígitos
       */

      valor = valor.padStart(2, "0");

      /*
       * Limita a 99
       */

      const numero = parseInt(valor, 10);

      if (numero < 1 || numero > 99) {

        valor = "01";

      }

      document
        .getElementById("consultorio-num")
        .value = valor;

      return valor;

    }


    /* =====================================================
       CARREGAR PACIENTES
    ===================================================== */

    async function carregar() {

      try {

        const response =
          await fetch("/triagens", {
            cache: "no-store"
          });

        if (!response.ok) {

          throw new Error(
            "Erro HTTP " + response.status
          );

        }

        const data =
          await response.json();

        if (!Array.isArray(data)) {

          throw new Error(
            "O servidor retornou dados inválidos."
          );

        }

        triagensCarregadas = data;

        renderizarTriagens();

      }

      catch (error) {

        console.error(
          "Erro ao carregar triagens:",
          error
        );

        document
          .getElementById("triagens")
          .innerHTML = `
            <div class="erro">
              ❌ Não foi possível carregar os pacientes.
              <br>
              <small>
                ${escapeHTML(error.message)}
              </small>
            </div>
          `;

      }

    }


    /* =====================================================
       RENDERIZAR PACIENTES
    ===================================================== */

    function renderizarTriagens() {

      const div =
        document.getElementById("triagens");

      div.innerHTML = "";

      if (triagensCarregadas.length === 0) {

        div.innerHTML = `
          <div class="mensagem-vazia">
            Nenhum paciente na fila.
          </div>
        `;

        return;

      }


      triagensCarregadas.forEach(
        (t, index) => {

          const card =
            document.createElement("div");

          card.className = "card";

          /*
           * Destaca o paciente selecionado
           */

          if (
            pacienteSelecionado &&
            pacienteSelecionado.index === index
          ) {

            card.classList.add(
              "card-atendimento"
            );

          }


          const nome =
            escapeHTML(
              t.nome || "Paciente"
            );

          const sintoma =
            escapeHTML(
              t.sintoma || "Não informado"
            );

          const temperatura =
            escapeHTML(
              t.temperatura || "Não informada"
            );

          const risco =
            escapeHTML(
              t.risco || "Não informado"
            );

          const alergia =
            escapeHTML(
              t.alergia || "Nenhuma"
            );

          const observacao =
            escapeHTML(
              t.observacao || "Nenhuma"
            );


          card.innerHTML = `

            <h3>${nome}</h3>

            <p>
              <b>Sintoma:</b>
              ${sintoma}
            </p>

            <p>
              <b>Temperatura:</b>
              ${temperatura}°C
            </p>

            <p>
              <span class="risco">
                ${risco}
              </span>
            </p>

            <p>
              <b>Alergia:</b>
              ${alergia}
            </p>

            <p>
              <b>Observação:</b>
              ${observacao}
            </p>

            <div
              style="
                display:flex;
                gap:8px;
                flex-wrap:wrap;
              "
            >

              <button
                type="button"
                class="btn-atender">
                👨‍⚕️ Atender
              </button>

              <button
                type="button"
                class="btn-tv">
                📺 Chamar na TV
              </button>

            </div>
          `;


          /* =================================================
             BOTÃO ATENDER
          ================================================= */

          const btnAtender =
            card.querySelector(
              ".btn-atender"
            );

          btnAtender.addEventListener(
            "click",
            () => {

              selecionar(index);

            }
          );


          /* =================================================
             BOTÃO TV
          ================================================= */

          const btnTV =
            card.querySelector(
              ".btn-tv"
            );

          btnTV.addEventListener(
            "click",
            () => {

              chamarNaTV(
                t.nome,
                btnTV
              );

            }
          );


          div.appendChild(card);

        }
      );

    }


    /* =====================================================
       CHAMAR PACIENTE NA TV
    ===================================================== */

    async function chamarNaTV(
      nome,
      botao
    ) {

      if (tvChamando) {

        return;

      }


      const paciente =
        String(nome || "").trim();

      if (!paciente) {

        alert(
          "Nome do paciente inválido."
        );

        return;

      }


      const consultorio =
        obterConsultorio();


      tvChamando = true;


      if (botao) {

        botao.disabled = true;

        botao.textContent =
          "⏳ Chamando...";

      }


      try {

        const response =
          await fetch(
            "/tv/chamar",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                localTipo:
                  "CONSULTÓRIO",

                localNumero:
                  consultorio,

                paciente:
                  paciente

              })

            }
          );


        let resultado = null;

        try {

          resultado =
            await response.json();

        }

        catch {

          resultado = null;

        }


        if (!response.ok) {

          throw new Error(
            resultado?.erro ||
            resultado?.message ||
            "Erro ao chamar paciente na TV."
          );

        }


        alert(
          "✅ " +
          paciente +
          " foi chamado na TV para o Consultório " +
          consultorio +
          "!"
        );

      }

      catch (error) {

        console.error(
          "Erro ao chamar paciente:",
          error
        );

        alert(
          "❌ Não foi possível chamar o paciente na TV.\n\n" +
          error.message
        );

      }

      finally {

        tvChamando = false;

        if (botao) {

          botao.disabled = false;

          botao.textContent =
            "📺 Chamar na TV";

        }

      }

    }


    /* =====================================================
       SELECIONAR PACIENTE
    ===================================================== */

    function selecionar(index) {

      const t =
        triagensCarregadas[index];


      if (!t) {

        alert(
          "Paciente não encontrado."
        );

        return;

      }


      pacienteSelecionado = {

        index: index,

        /*
         * Caso o backend tenha um ID,
         * ele será preservado.
         */

        id: t.id ?? null,

        nome: t.nome

      };


      document
        .getElementById("paciente")
        .value =
        t.nome || "";


      document
        .getElementById("obs")
        .value =
        t.observacao || "";


      /*
       * Limpa diagnóstico e medicação
       * ao trocar de paciente.
       */

      document
        .getElementById("diagnostico")
        .value = "";


      document
        .getElementById("medicacao")
        .value = "";


      /*
       * Alerta de alergia
       */

      if (
        t.alergia &&
        t.alergia !== "Nenhuma"
      ) {

        alert(
          "⚠️ Paciente possui alergia: " +
          t.alergia
        );

      }


      renderizarTriagens();


      /*
       * Coloca o cursor no diagnóstico
       */

      document
        .getElementById("diagnostico")
        .focus();

    }


    /* =====================================================
       CARREGAR MEDICAÇÕES
    ===================================================== */

    async function carregarMedicacoes() {

      const select =
        document.getElementById(
          "medicacao"
        );


      try {

        const response =
          await fetch(
            "/lista-medicacoes",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Erro HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (!Array.isArray(data)) {

          throw new Error(
            "Lista de medicações inválida."
          );

        }


        select.innerHTML = "";

        const primeiraOpcao =
          document.createElement(
            "option"
          );

        primeiraOpcao.value = "";

        primeiraOpcao.textContent =
          "Selecione a medicação";

        select.appendChild(
          primeiraOpcao
        );


        /*
         * Opção para casos sem medicação
         */

        const nenhuma =
          document.createElement(
            "option"
          );

        nenhuma.value =
          "Nenhuma";

        nenhuma.textContent =
          "Nenhuma";

        select.appendChild(
          nenhuma
        );


        data.forEach(
          med => {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              String(med);

            option.textContent =
              String(med);

            select.appendChild(
              option
            );

          }
        );

      }

      catch (error) {

        console.error(
          "Erro ao carregar medicações:",
          error
        );

        select.innerHTML = `
          <option value="">
            Erro ao carregar medicações
          </option>
        `;

      }

    }


    /* =====================================================
       PEGAR DADOS DA CONSULTA
    ===================================================== */

    function obterDadosConsulta() {

      const paciente =
        document
          .getElementById("paciente")
          .value
          .trim();


      const diagnostico =
        document
          .getElementById("diagnostico")
          .value
          .trim();


      const medicacao =
        document
          .getElementById("medicacao")
          .value
          .trim();


      const obs =
        document
          .getElementById("obs")
          .value
          .trim();


      return {

        paciente,

        diagnostico,

        medicacao,

        obs,

        /*
         * Se o backend utilizar ID,
         * ele poderá usar este campo.
         */

        pacienteId:
          pacienteSelecionado?.id ?? null

      };

    }


    /* =====================================================
       SALVAR CONSULTA
    ===================================================== */

    async function salvar() {

      if (consultaSalvando) {

        return;

      }


      const dados =
        obterDadosConsulta();


      if (!dados.paciente) {

        alert(
          "⚠️ Selecione um paciente clicando em 'Atender'."
        );

        return;

      }


      if (!dados.diagnostico) {

        alert(
          "⚠️ Informe o diagnóstico."
        );

        document
          .getElementById("diagnostico")
          .focus();

        return;

      }


      if (!dados.medicacao) {

        alert(
          "⚠️ Selecione uma medicação ou escolha 'Nenhuma'."
        );

        return;

      }


      consultaSalvando = true;


      try {

        const response =
          await fetch(
            "/consulta",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                paciente:
                  dados.paciente,

                pacienteId:
                  dados.pacienteId,

                diagnostico:
                  dados.diagnostico,

                medicacao:
                  dados.medicacao,

                obs:
                  dados.obs

              })

            }
          );


        let resultado = null;

        try {

          resultado =
            await response.json();

        }

        catch {

          resultado = null;

        }


        if (!response.ok) {

          throw new Error(
            resultado?.erro ||
            resultado?.message ||
            "Erro ao salvar consulta."
          );

        }


        alert(
          "✅ Consulta salva com sucesso!"
        );


        /*
         * Limpa somente os dados
         * da consulta.
         */

        document
          .getElementById("diagnostico")
          .value = "";


        document
          .getElementById("medicacao")
          .value = "";


        /*
         * Mantém paciente e observação
         * selecionados para continuidade.
         */

      }

      catch (error) {

        console.error(
          "Erro ao salvar consulta:",
          error
        );

        alert(
          "❌ Não foi possível salvar a consulta.\n\n" +
          error.message
        );

      }

      finally {

        consultaSalvando = false;

      }

    }


    /* =====================================================
       DAR ALTA + GERAR PDF
    ===================================================== */

    async function darAlta() {

      if (altaProcessando) {

        return;

      }


      const dados =
        obterDadosConsulta();


      if (!dados.paciente) {

        alert(
          "⚠️ Primeiro selecione um paciente em 'Atender'."
        );

        return;

      }


      if (!dados.diagnostico) {

        alert(
          "⚠️ Informe o diagnóstico antes de dar alta."
        );

        document
          .getElementById("diagnostico")
          .focus();

        return;

      }


      if (!dados.medicacao) {

        alert(
          "⚠️ Selecione uma medicação ou escolha 'Nenhuma'."
        );

        return;

      }


      const confirmar =
        confirm(
          "Deseja realmente dar alta para " +
          dados.paciente +
          " e gerar o PDF de alta?"
        );


      if (!confirmar) {

        return;

      }


      /*
       * Abre a aba imediatamente,
       * evitando bloqueio de popup
       * por alguns navegadores.
       */

      const novaAba =
        window.open(
          "",
          "_blank"
        );


      if (!novaAba) {

        alert(
          "⚠️ O navegador bloqueou a nova aba.\n\n" +
          "Permita pop-ups para este site e tente novamente."
        );

        return;

      }


      altaProcessando = true;


      const btnAlta =
        document.getElementById(
          "btn-alta"
        );


      btnAlta.disabled = true;

      btnAlta.textContent =
        "⏳ Gerando PDF...";


      try {

        const response =
          await fetch(
            "/alta",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                paciente:
                  dados.paciente,

                pacienteId:
                  dados.pacienteId,

                diagnostico:
                  dados.diagnostico,

                medicacao:
                  dados.medicacao,

                obs:
                  dados.obs

              })

            }
          );


        if (!response.ok) {

          let mensagem =
            "Erro ao gerar alta.";

          try {

            const erro =
              await response.json();

            mensagem =
              erro.erro ||
              erro.message ||
              mensagem;

          }

          catch {

            try {

              const texto =
                await response.text();

              if (texto) {

                mensagem = texto;

              }

            }

            catch {}

          }


          throw new Error(
            mensagem
          );

        }


        const contentType =
          response.headers.get(
            "content-type"
          ) || "";


        if (
          !contentType.includes(
            "application/pdf"
          )
        ) {

          console.warn(
            "O servidor não informou application/pdf."
          );

        }


        const blob =
          await response.blob();


        if (!blob || blob.size === 0) {

          throw new Error(
            "O servidor retornou um PDF vazio."
          );

        }


        const url =
          window.URL.createObjectURL(
            blob
          );


        /*
         * Mostra o PDF na aba aberta.
         */

        novaAba.location.href =
          url;


        /*
         * Limpa o formulário.
         */

        document
          .getElementById("paciente")
          .value = "";


        document
          .getElementById("diagnostico")
          .value = "";


        document
          .getElementById("medicacao")
          .value = "";


        document
          .getElementById("obs")
          .value = "";


        pacienteSelecionado = null;


        /*
         * Atualiza a fila.
         */

        await carregar();


        alert(
          "✅ Alta realizada com sucesso!"
        );


        /*
         * Libera a URL temporária depois
         * de um período.
         */

        setTimeout(
          () => {

            window.URL.revokeObjectURL(
              url
            );

          },
          60000
        );

      }

      catch (error) {

        console.error(
          "Erro ao gerar alta:",
          error
        );


        /*
         * Fecha a aba vazia caso
         * tenha ocorrido erro.
         */

        try {

          novaAba.close();

        }

        catch {}


        alert(
          "❌ Não foi possível gerar o PDF de alta.\n\n" +
          error.message
        );

      }

      finally {

        altaProcessando = false;

        btnAlta.disabled = false;

        btnAlta.textContent =
          "🏠 Dar Alta e Gerar PDF";

      }

    }


    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    async function inicializar() {

      await Promise.all([
        carregar(),
        carregarMedicacoes()
      ]);

    }


    inicializar();


    /* =====================================================
       ATUALIZA A FILA A CADA 10 SEGUNDOS
    ===================================================== */

    setInterval(
      () => {

        /*
         * Não recarrega enquanto uma alta
         * estiver sendo processada.
         */

        if (!altaProcessando) {

          carregar();

        }

      },
      10000
    );


    /* =====================================================
       VALIDAR CAMPO DO CONSULTÓRIO
    ===================================================== */

    document
      .getElementById("consultorio-num")
      .addEventListener(
        "input",
        function () {

          this.value =
            this.value
              .replace(/\D/g, "")
              .slice(0, 2);

        }
      );


  </script>

</body>

</html>
