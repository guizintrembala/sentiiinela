<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Médico</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    /* =====================================================
       BOTÃO TV
    ===================================================== */

    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-tv:disabled {
      background: #999;
      cursor: not-allowed;
    }


    /* =====================================================
       BOTÃO ABRIR TV
    ===================================================== */

    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }


    /* =====================================================
       CONSULTÓRIO
    ===================================================== */

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
    }

    .consultorio-input label {
      font-weight: bold;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }


    /* =====================================================
       BOTÃO ALTA
    ===================================================== */

    .btn-alta {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-left: 8px;
    }

    .btn-alta:hover {
      background: #0056b3;
    }

    .btn-alta:disabled {
      background: #999;
      cursor: not-allowed;
    }


    /* =====================================================
       BOTÕES CONSULTA
    ===================================================== */

    .botoes-consulta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .botoes-consulta button {
      cursor: pointer;
    }


    /* =====================================================
       CARDS
    ===================================================== */

    .card {
      margin-bottom: 12px;
    }

    .card-atendimento {
      border: 2px solid #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.25);
    }


    /* =====================================================
       MENSAGEM VAZIA
    ===================================================== */

    .mensagem-vazia {
      color: #888;
      text-align: center;
      padding: 20px;
    }


    /* =====================================================
       ERRO
    ===================================================== */

    .erro {
      color: #dc3545;
      background: #fff0f0;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #f5c2c7;
    }


    /* =====================================================
       RISCO
    ===================================================== */

    .risco {
      font-weight: bold;
    }


    /* =====================================================
       FORMULÁRIO DE ALTA
    ===================================================== */

    .form-alta {
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-top: 15px;
    }


    .campo-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
    }


    .campo-form label {
      font-weight: bold;
      color: #333;
    }


    .campo-form input,
    .campo-form select,
    .campo-form textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
    }


    .campo-form input:focus,
    .campo-form select:focus,
    .campo-form textarea:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.1);
    }


    .campo-form textarea {
      min-height: 90px;
      resize: vertical;
    }


    .linha-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }


    .info-formulario {
      background: #e9f5ff;
      border: 1px solid #b8daff;
      color: #004085;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 14px;
    }


    /* =====================================================
       RESPONSIVIDADE
    ===================================================== */

    @media (max-width: 700px) {

      .linha-form {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .consultorio-input {
        flex-wrap: wrap;
      }

      .btn-alta {
        margin-left: 0;
      }

    }

  </style>
</head>


<body>

  <div class="container">

    <!-- ===================================================
         CABEÇALHO
    =================================================== -->

    <header>

      <h1>Painel Médico</h1>

      <p>
        Atendimento e gerenciamento de pacientes
      </p>

    </header>


    <!-- ===================================================
         TOPO
    =================================================== -->

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      gap:10px;
      flex-wrap:wrap;
    ">

      <h2 style="margin:0;">
        🩺 Painel Médico
      </h2>

      <button
        type="button"
        class="btn-abrir-tv"
        onclick="abrirTV()">

        📺 Abrir Tela da TV

      </button>

    </div>


    <!-- ===================================================
         CONSULTÓRIO
    =================================================== -->

    <div class="consultorio-input">

      <label for="consultorio-num">
        Meu Consultório:
      </label>

      <input
        type="text"
        id="consultorio-num"
        value="01"
        maxlength="2"
        inputmode="numeric"
        autocomplete="off">

      <span style="color:#666; font-size:13px;">

        Este número será exibido na TV ao chamar o paciente.

      </span>

    </div>


    <!-- ===================================================
         FILA DE TRIAGEM
    =================================================== -->

    <h3>
      👥 Pacientes aguardando atendimento
    </h3>

    <div id="triagens"></div>


    <hr>


    <!-- ===================================================
         FORMULÁRIO DE ALTA
    =================================================== -->

    <h3>
      🏠 Alta do Paciente
    </h3>


    <div class="form-alta">


      <div class="info-formulario">

        ℹ️ Selecione um paciente na fila clicando em
        <b>"Atender"</b> para preencher a alta.

      </div>


      <!-- PACIENTE -->

      <div class="campo-form">

        <label for="paciente">
          Paciente
        </label>

        <input
          id="paciente"
          placeholder="Selecione um paciente"
          readonly>

      </div>


      <!-- DADOS PESSOAIS -->

      <div class="linha-form">


        <div class="campo-form">

          <label for="data-nascimento">
            Data de nascimento
          </label>

          <input
            type="date"
            id="data-nascimento">

        </div>


        <div class="campo-form">

          <label for="cpf">
            CPF
          </label>

          <input
            type="text"
            id="cpf"
            placeholder="000.000.000-00"
            maxlength="14">

        </div>


      </div>


      <!-- DIAGNÓSTICO E MEDICAÇÃO -->

      <div class="linha-form">


        <div class="campo-form">

          <label for="diagnostico">
            Diagnóstico
          </label>

          <input
            id="diagnostico"
            placeholder="Informe o diagnóstico">

        </div>


        <div class="campo-form">

          <label for="medicacao">
            Medicação
          </label>

          <select id="medicacao">

            <option value="">
              Selecione a medicação
            </option>

          </select>

        </div>


      </div>


      <!-- PROCEDIMENTO -->

      <div class="campo-form">

        <label for="procedimento">
          Procedimento realizado
        </label>

        <textarea
          id="procedimento"
          placeholder="Descreva o procedimento realizado...">
        </textarea>

      </div>


      <!-- ORIENTAÇÕES -->

      <div class="campo-form">

        <label for="orientacoes">
          Orientações ao paciente
        </label>

        <textarea
          id="orientacoes"
          placeholder="Informe os cuidados, recomendações e orientações para casa...">
        </textarea>

      </div>


      <!-- OBSERVAÇÕES -->

      <div class="campo-form">

        <label for="obs">
          Observações
        </label>

        <textarea
          id="obs"
          placeholder="Observações adicionais...">
        </textarea>

      </div>


      <!-- MÉDICO -->

      <div class="linha-form">


        <div class="campo-form">

          <label for="medico">
            Médico responsável
          </label>

          <input
            type="text"
            id="medico"
            placeholder="Nome do médico">

        </div>


        <div class="campo-form">

          <label for="crm">
            CRM
          </label>

          <input
            type="text"
            id="crm"
            placeholder="CRM">

        </div>


      </div>


      <!-- BOTÕES -->

      <div class="botoes-consulta">

        <button
          type="button"
          onclick="salvar()">

          💾 Salvar Consulta

        </button>


        <button
          type="button"
          class="btn-alta"
          id="btn-alta"
          onclick="darAlta()">

          🏠 Dar Alta e Gerar PDF

        </button>

      </div>


    </div>

  </div>


  <script>


    /* =====================================================
       VARIÁVEIS
    ===================================================== */

    let triagensCarregadas = [];

    let pacienteSelecionado = null;

    let consultaSalvando = false;

    let altaProcessando = false;

    let tvChamando = false;


    /* =====================================================
       ESCAPAR HTML
    ===================================================== */

    function escapeHTML(valor) {

      return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       ABRIR TV
    ===================================================== */

    function abrirTV() {

      window.open(
        "tv.html",
        "_blank"
      );

    }


    /* =====================================================
       VALIDAR CONSULTÓRIO
    ===================================================== */

    function obterConsultorio() {

      let valor =
        document
          .getElementById("consultorio-num")
          .value
          .trim();


      if (!valor) {

        valor = "01";

      }


      valor =
        valor.replace(/\D/g, "");


      if (!valor) {

        valor = "01";

      }


      valor =
        valor.padStart(2, "0");


      const numero =
        parseInt(valor, 10);


      if (numero < 1 || numero > 99) {

        valor = "01";

      }


      document
        .getElementById("consultorio-num")
        .value = valor;


      return valor;

    }


    /* =====================================================
       CARREGAR PACIENTES
    ===================================================== */

    async function carregar() {

      try {

        const response =
          await fetch(
            "/triagens",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Erro HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (!Array.isArray(data)) {

          throw new Error(
            "O servidor retornou dados inválidos."
          );

        }


        triagensCarregadas = data;


        renderizarTriagens();

      }


      catch (error) {

        console.error(
          "Erro ao carregar triagens:",
          error
        );


        document
          .getElementById("triagens")
          .innerHTML = `

            <div class="erro">

              ❌ Não foi possível carregar os pacientes.

              <br>

              <small>
                ${escapeHTML(error.message)}
              </small>

            </div>

          `;

      }

    }


    /* =====================================================
       RENDERIZAR PACIENTES
       
       MOSTRA SOMENTE 5 PACIENTES
    ===================================================== */

    function renderizarTriagens() {

      const div =
        document.getElementById("triagens");


      div.innerHTML = "";


      if (
        triagensCarregadas.length === 0
      ) {

        div.innerHTML = `

          <div class="mensagem-vazia">

            Nenhum paciente na fila.

          </div>

        `;

        return;

      }


      /*
       * Mostra somente os primeiros 5 pacientes.
       * Não cria pacientes fictícios.
       * Todos continuam vindo do backend.
       */

      const pacientesExibidos =
        triagensCarregadas.slice(0, 5);


      pacientesExibidos.forEach(
        (t, index) => {


          const card =
            document.createElement("div");


          card.className = "card";


          /*
           * Destaca paciente selecionado.
           */

          if (
            pacienteSelecionado &&
            pacienteSelecionado.index === index
          ) {

            card.classList.add(
              "card-atendimento"
            );

          }


          const nome =
            escapeHTML(
              t.nome || "Paciente"
            );


          const sintoma =
            escapeHTML(
              t.sintoma || "Não informado"
            );


          const temperatura =
            escapeHTML(
              t.temperatura || "Não informada"
            );


          const risco =
            escapeHTML(
              t.risco || "Não informado"
            );


          const alergia =
            escapeHTML(
              t.alergia || "Nenhuma"
            );


          const observacao =
            escapeHTML(
              t.observacao || "Nenhuma"
            );


          card.innerHTML = `

            <h3>
              ${nome}
            </h3>


            <p>

              <b>Sintoma:</b>

              ${sintoma}

            </p>


            <p>

              <b>Temperatura:</b>

              ${temperatura}°C

            </p>


            <p>

              <span class="risco">

                ${risco}

              </span>

            </p>


            <p>

              <b>Alergia:</b>

              ${alergia}

            </p>


            <p>

              <b>Observação:</b>

              ${observacao}

            </p>


            <div
              style="
                display:flex;
                gap:8px;
                flex-wrap:wrap;
              "
            >


              <button
                type="button"
                class="btn-atender">

                👨‍⚕️ Atender

              </button>


              <button
                type="button"
                class="btn-tv">

                📺 Chamar na TV

              </button>


            </div>

          `;


          /* =================================================
             BOTÃO ATENDER
          ================================================= */

          const btnAtender =
            card.querySelector(
              ".btn-atender"
            );


          btnAtender.addEventListener(
            "click",
            () => {

              selecionar(index);

            }
          );


          /* =================================================
             BOTÃO TV
          ================================================= */

          const btnTV =
            card.querySelector(
              ".btn-tv"
            );


          btnTV.addEventListener(
            "click",
            () => {

              chamarNaTV(
                t.nome,
                btnTV
              );

            }
          );


          div.appendChild(card);

        }
      );


      /*
       * Informa se existem mais pacientes
       * além dos 5 exibidos.
       */

      if (
        triagensCarregadas.length > 5
      ) {

        const aviso =
          document.createElement("p");


        aviso.style.color = "#777";

        aviso.style.textAlign = "center";

        aviso.textContent =
          `Existem ${
            triagensCarregadas.length - 5
          } paciente(s) aguardando na fila.`;


        div.appendChild(aviso);

      }

    }


    /* =====================================================
       CHAMAR PACIENTE NA TV
    ===================================================== */

    async function chamarNaTV(
      nome,
      botao
    ) {


      if (tvChamando) {

        return;

      }


      const paciente =
        String(nome || "").trim();


      if (!paciente) {

        alert(
          "Nome do paciente inválido."
        );

        return;

      }


      const consultorio =
        obterConsultorio();


      tvChamando = true;


      if (botao) {

        botao.disabled = true;

        botao.textContent =
          "⏳ Chamando...";

      }


      try {

        const response =
          await fetch(
            "/tv/chamar",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                localTipo:
                  "CONSULTÓRIO",

                localNumero:
                  consultorio,

                paciente:
                  paciente

              })

            }
          );


        let resultado = null;


        try {

          resultado =
            await response.json();

        }

        catch {

          resultado = null;

        }


        if (!response.ok) {

          throw new Error(
            resultado?.erro ||
            resultado?.message ||
            "Erro ao chamar paciente na TV."
          );

        }


        alert(
          "✅ " +
          paciente +
          " foi chamado na TV para o Consultório " +
          consultorio +
          "!"
        );

      }


      catch (error) {

        console.error(
          "Erro ao chamar paciente:",
          error
        );


        alert(
          "❌ Não foi possível chamar o paciente na TV.\n\n" +
          error.message
        );

      }


      finally {

        tvChamando = false;


        if (botao) {

          botao.disabled = false;

          botao.textContent =
            "📺 Chamar na TV";

        }

      }

    }


    /* =====================================================
       SELECIONAR PACIENTE
    ===================================================== */

    function selecionar(index) {


      const t =
        triagensCarregadas[index];


      if (!t) {

        alert(
          "Paciente não encontrado."
        );

        return;

      }


      pacienteSelecionado = {

        index: index,

        id: t.id ?? null,

        nome: t.nome

      };


      /*
       * Preenche o paciente.
       */

      document
        .getElementById("paciente")
        .value =
        t.nome || "";


      /*
       * Puxa observação da triagem.
       */

      document
        .getElementById("obs")
        .value =
        t.observacao || "";


      /*
       * Limpa campos da nova consulta.
       */

      document
        .getElementById("diagnostico")
        .value = "";


      document
        .getElementById("medicacao")
        .value = "";


      document
        .getElementById("procedimento")
        .value = "";


      document
        .getElementById("orientacoes")
        .value = "";


      document
        .getElementById("data-nascimento")
        .value = "";


      document
        .getElementById("cpf")
        .value = "";


      /*
       * Alerta de alergia.
       */

      if (
        t.alergia &&
        t.alergia !== "Nenhuma"
      ) {

        alert(
          "⚠️ Paciente possui alergia: " +
          t.alergia
        );

      }


      renderizarTriagens();


      /*
       * Foco no diagnóstico.
       */

      document
        .getElementById("diagnostico")
        .focus();

    }


    /* =====================================================
       CARREGAR MEDICAÇÕES
    ===================================================== */

    async function carregarMedicacoes() {


      const select =
        document.getElementById(
          "medicacao"
        );


      try {

        const response =
          await fetch(
            "/lista-medicacoes",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Erro HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (!Array.isArray(data)) {

          throw new Error(
            "Lista de medicações inválida."
          );

        }


        select.innerHTML = "";


        const primeiraOpcao =
          document.createElement(
            "option"
          );


        primeiraOpcao.value = "";

        primeiraOpcao.textContent =
          "Selecione a medicação";


        select.appendChild(
          primeiraOpcao
        );


        /*
         * Opção sem medicação.
         */

        const nenhuma =
          document.createElement(
            "option"
          );


        nenhuma.value =
          "Nenhuma";


        nenhuma.textContent =
          "Nenhuma";


        select.appendChild(
          nenhuma
        );


        data.forEach(
          med => {


            const option =
              document.createElement(
                "option"
              );


            option.value =
              String(med);


            option.textContent =
              String(med);


            select.appendChild(
              option
            );

          }
        );

      }


      catch (error) {

        console.error(
          "Erro ao carregar medicações:",
          error
        );


        select.innerHTML = `

          <option value="">

            Erro ao carregar medicações

          </option>

        `;

      }

    }


    /* =====================================================
       OBTER DADOS DA CONSULTA / ALTA
    ===================================================== */

    function obterDadosConsulta() {


      const paciente =
        document
          .getElementById("paciente")
          .value
          .trim();


      const dataNascimento =
        document
          .getElementById("data-nascimento")
          .value
          .trim();


      const cpf =
        document
          .getElementById("cpf")
          .value
          .trim();


      const diagnostico =
        document
          .getElementById("diagnostico")
          .value
          .trim();


      const medicacao =
        document
          .getElementById("medicacao")
          .value
          .trim();


      const procedimento =
        document
          .getElementById("procedimento")
          .value
          .trim();


      const orientacoes =
        document
          .getElementById("orientacoes")
          .value
          .trim();


      const obs =
        document
          .getElementById("obs")
          .value
          .trim();


      const medico =
        document
          .getElementById("medico")
          .value
          .trim();


      const crm =
        document
          .getElementById("crm")
          .value
          .trim();


      return {

        paciente,

        pacienteId:
          pacienteSelecionado?.id ?? null,

        dataNascimento,

        cpf,

        diagnostico,

        medicacao,

        procedimento,

        orientacoes,

        obs,

        medico,

        crm

      };

    }


    /* =====================================================
       SALVAR CONSULTA
    ===================================================== */

    async function salvar() {


      if (consultaSalvando) {

        return;

      }


      const dados =
        obterDadosConsulta();


      if (!dados.paciente) {

        alert(
          "⚠️ Selecione um paciente clicando em 'Atender'."
        );

        return;

      }


      if (!dados.diagnostico) {

        alert(
          "⚠️ Informe o diagnóstico."
        );


        document
          .getElementById("diagnostico")
          .focus();


        return;

      }


      if (!dados.medicacao) {

        alert(
          "⚠️ Selecione uma medicação ou escolha 'Nenhuma'."
        );

        return;

      }


      consultaSalvando = true;


      try {

        const response =
          await fetch(
            "/consulta",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                paciente:
                  dados.paciente,

                pacienteId:
                  dados.pacienteId,

                dataNascimento:
                  dados.dataNascimento,

                cpf:
                  dados.cpf,

                diagnostico:
                  dados.diagnostico,

                medicacao:
                  dados.medicacao,

                procedimento:
                  dados.procedimento,

                orientacoes:
                  dados.orientacoes,

                obs:
                  dados.obs,

                medico:
                  dados.medico,

                crm:
                  dados.crm

              })

            }
          );


        let resultado = null;


        try {

          resultado =
            await response.json();

        }

        catch {

          resultado = null;

        }


        if (!response.ok) {

          throw new Error(
            resultado?.erro ||
            resultado?.message ||
            "Erro ao salvar consulta."
          );

        }


        alert(
          "✅ Consulta salva com sucesso!"
        );

      }


      catch (error) {

        console.error(
          "Erro ao salvar consulta:",
          error
        );


        alert(
          "❌ Não foi possível salvar a consulta.\n\n" +
          error.message
        );

      }


      finally {

        consultaSalvando = false;

      }

    }


    /* =====================================================
       DAR ALTA + GERAR PDF
    ===================================================== */

    async function darAlta() {


      if (altaProcessando) {

        return;

      }


      const dados =
        obterDadosConsulta();


      /* -----------------------------------------------------
         VALIDAÇÕES
      ----------------------------------------------------- */

      if (!dados.paciente) {

        alert(
          "⚠️ Primeiro selecione um paciente em 'Atender'."
        );

        return;

      }


      if (!dados.diagnostico) {

        alert(
          "⚠️ Informe o diagnóstico antes de dar alta."
        );


        document
          .getElementById("diagnostico")
          .focus();


        return;

      }


      if (!dados.medicacao) {

        alert(
          "⚠️ Selecione uma medicação ou escolha 'Nenhuma'."
        );

        return;

      }


      if (!dados.procedimento) {

        alert(
          "⚠️ Informe o procedimento realizado."
        );


        document
          .getElementById("procedimento")
          .focus();


        return;

      }


      if (!dados.orientacoes) {

        alert(
          "⚠️ Informe as orientações para o paciente."
        );


        document
          .getElementById("orientacoes")
          .focus();


        return;

      }


      /* -----------------------------------------------------
         CONFIRMAÇÃO
      ----------------------------------------------------- */

      const confirmar =
        confirm(
          "Deseja realmente dar alta para " +
          dados.paciente +
          " e gerar o PDF de alta?"
        );


      if (!confirmar) {

        return;

      }


      /* -----------------------------------------------------
         ABRIR ABA ANTES DO FETCH
      ----------------------------------------------------- */

      const novaAba =
        window.open(
          "",
          "_blank"
        );


      if (!novaAba) {

        alert(
          "⚠️ O navegador bloqueou a nova aba.\n\n" +
          "Permita pop-ups para este site e tente novamente."
        );

        return;

      }


      altaProcessando = true;


      const btnAlta =
        document.getElementById(
          "btn-alta"
        );


      btnAlta.disabled = true;


      btnAlta.textContent =
        "⏳ Gerando PDF...";


      try {


        /* -------------------------------------------------
           ENVIA TODOS OS DADOS PARA O BACKEND
        ------------------------------------------------- */

        const response =
          await fetch(
            "/alta",
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body: JSON.stringify({

                paciente:
                  dados.paciente,

                pacienteId:
                  dados.pacienteId,

                dataNascimento:
                  dados.dataNascimento,

                cpf:
                  dados.cpf,

                diagnostico:
                  dados.diagnostico,

                medicacao:
                  dados.medicacao,

                procedimento:
                  dados.procedimento,

                orientacoes:
                  dados.orientacoes,

                obs:
                  dados.obs,

                medico:
                  dados.medico,

                crm:
                  dados.crm

              })

            }
          );


        /* -------------------------------------------------
           TRATAMENTO DE ERRO
        ------------------------------------------------- */

        if (!response.ok) {


          let mensagem =
            "Erro ao gerar alta.";


          try {

            const erro =
              await response.json();


            mensagem =
              erro.erro ||
              erro.message ||
              mensagem;

          }


          catch {

            try {

              const texto =
                await response.text();


              if (texto) {

                mensagem = texto;

              }

            }


            catch {}

          }


          throw new Error(
            mensagem
          );

        }


        /* -------------------------------------------------
           VERIFICAR PDF
        ------------------------------------------------- */

        const contentType =
          response.headers.get(
            "content-type"
          ) || "";


        if (
          !contentType.includes(
            "application/pdf"
          )
        ) {

          console.warn(
            "O servidor não informou application/pdf."
          );

        }


        const blob =
          await response.blob();


        if (
          !blob ||
          blob.size === 0
        ) {

          throw new Error(
            "O servidor retornou um PDF vazio."
          );

        }


        /* -------------------------------------------------
           CRIAR URL DO PDF
        ------------------------------------------------- */

        const url =
          window.URL.createObjectURL(
            blob
          );


        /* -------------------------------------------------
           MOSTRAR PDF
        ------------------------------------------------- */

        novaAba.location.href =
          url;


        /* -------------------------------------------------
           LIMPAR FORMULÁRIO
        ------------------------------------------------- */

        limparFormulario();


        pacienteSelecionado =
          null;


        /* -------------------------------------------------
           ATUALIZAR FILA
        ------------------------------------------------- */

        await carregar();


        alert(
          "✅ Alta realizada com sucesso!"
        );


        /* -------------------------------------------------
           LIBERAR URL TEMPORÁRIA
        ------------------------------------------------- */

        setTimeout(
          () => {

            window.URL.revokeObjectURL(
              url
            );

          },
          60000
        );

      }


      catch (error) {

        console.error(
          "Erro ao gerar alta:",
          error
        );


        try {

          novaAba.close();

        }

        catch {}


        alert(
          "❌ Não foi possível gerar o PDF de alta.\n\n" +
          error.message
        );

      }


      finally {

        altaProcessando = false;


        btnAlta.disabled = false;


        btnAlta.textContent =
          "🏠 Dar Alta e Gerar PDF";

      }

    }


    /* =====================================================
       LIMPAR FORMULÁRIO
    ===================================================== */

    function limparFormulario() {


      document
        .getElementById("paciente")
        .value = "";


      document
        .getElementById("data-nascimento")
        .value = "";


      document
        .getElementById("cpf")
        .value = "";


      document
        .getElementById("diagnostico")
        .value = "";


      document
        .getElementById("medicacao")
        .value = "";


      document
        .getElementById("procedimento")
        .value = "";


      document
        .getElementById("orientacoes")
        .value = "";


      document
        .getElementById("obs")
        .value = "";


      /*
       * Médico e CRM não são apagados,
       * pois normalmente permanecem os mesmos
       * durante os atendimentos.
       */

    }


    /* =====================================================
       MÁSCARA CPF
    ===================================================== */

    document
      .getElementById("cpf")
      .addEventListener(
        "input",
        function () {


          let valor =
            this.value.replace(
              /\D/g,
              ""
            );


          valor =
            valor.substring(
              0,
              11
            );


          if (
            valor.length > 9
          ) {

            valor =
              valor.replace(
                /^(\d{3})(\d{3})(\d{3})(\d{2}).*/,
                "$1.$2.$3-$4"
              );

          }

          else if (
            valor.length > 6
          ) {

            valor =
              valor.replace(
                /^(\d{3})(\d{3})(\d{1,3}).*/,
                "$1.$2.$3"
              );

          }

          else if (
            valor.length > 3
          ) {

            valor =
              valor.replace(
                /^(\d{3})(\d{1,3}).*/,
                "$1.$2"
              );

          }


          this.value =
            valor;

        }
      );


    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    async function inicializar() {


      await Promise.all([

        carregar(),

        carregarMedicacoes()

      ]);

    }


    inicializar();


    /* =====================================================
       ATUALIZA A FILA A CADA 10 SEGUNDOS
    ===================================================== */

    setInterval(
      () => {


        /*
         * Não atualiza enquanto a alta
         * estiver sendo processada.
         */

        if (!altaProcessando) {

          carregar();

        }

      },
      10000
    );


    /* =====================================================
       VALIDAR CONSULTÓRIO
    ===================================================== */

    document
      .getElementById("consultorio-num")
      .addEventListener(
        "input",
        function () {


          this.value =
            this.value
              .replace(/\D/g, "")
              .slice(0, 2);

        }
      );

  </script>
