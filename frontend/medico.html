<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

  <style>
    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
    }

    .consultorio-input label {
      font-weight: bold;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Painel de Alunos</h1>
      <p>Demonstração de CRUD FrontEnd/Backend (Node.js)</p>

      <button
        onclick="window.print()"
        style="
          margin-top: 1rem;
          padding: 10px 20px;
          font-weight: bold;
          cursor: pointer;
          border-radius: 8px;
          border: none;
          background: white;
          color: var(--primary-color);
        "
      >
        ⬇️ Baixar PDF
      </button>
    </header>

      <h2 style="margin: 0;">🩺 Painel Médico</h2>

      <button
        class="btn-abrir-tv"
        onclick="window.open('tv.html', '_blank')"
      >
        📺 Abrir Tela da TV
      </button>
    </div>

      <span style="color: #666; font-size: 13px;">
        Este número será exibido na TV ao chamar o paciente.
      </span>
    </div>

    <hr>

    <h3>Consulta</h3>

   <input
  id="paciente"
  placeholder="Paciente"
  type="text"
>

    <input
      id="diagnostico"
      placeholder="Diagnóstico"
    >

    <select id="medicacao">
      <option value="">Selecione a medicação</option>
    </select>

    <textarea
      id="obs"
      placeholder="Observações"
    ></textarea>

    <button onclick="salvar()">Salvar</button>

  </div>

  <script>
    let triagensCarregadas = [];

    /**
     * Escapa caracteres especiais para evitar problemas
     * quando os dados vindos do backend forem inseridos no HTML.
     */
    function escaparHTML(valor) {
      if (valor === null || valor === undefined) {
        return "";
      }

      return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function carregar() {
      fetch("/triagens")
        .then(response => {
          if (!response.ok) {
            throw new Error("Erro ao carregar a fila de pacientes.");
          }

          return response.json();
        })
        .then(data => {
          triagensCarregadas = Array.isArray(data) ? data : [];

          const div = document.getElementById("triagens");
          div.innerHTML = "";

          if (triagensCarregadas.length === 0) {
            div.innerHTML = `
              <p style="color: #888; text-align: center;">
                Nenhum paciente na fila.
              </p>
            `;
            return;
          }

          triagensCarregadas.forEach((t, index) => {
            const nome = escaparHTML(t.nome || "Paciente");
            const sintoma = escaparHTML(
              t.sintoma || "Não informado"
            );
            const temperatura = escaparHTML(
              t.temperatura || "Não informada"
            );
            const risco = escaparHTML(
              t.risco || "Não informado"
            );
            const alergia = escaparHTML(
              t.alergia || "Nenhuma"
            );
            const observacao = escaparHTML(
              t.observacao || "Nenhuma"
            );

            div.innerHTML += `
              <div class="card">

                <h3>${nome}</h3>

                <p>
                  <b>Sintoma:</b>
                  ${sintoma}
                </p>

                <p>
                  <b>Temperatura:</b>
                  ${temperatura}°C
                </p>

                <p>
                  <span class="${risco}">
                    ${risco}
                  </span>
                </p>

                <p>
                  <b>Alergia:</b>
                  ${alergia}
                </p>

                <p>
                  <b>Observação:</b>
                  ${observacao}
                </p>

                <div
                  style="
                    display: flex;
                    gap: 8px;
                    flex-wrap: wrap;
                  "
                >
                  <button onclick="selecionar(${index})">
                    Atender
                  </button>

                  <button
                    class="btn-tv"
                    onclick="chamarNaTV(${index})"
                  >
                    📺 Chamar na TV
                  </button>
                </div>

              </div>
            `;
          });
        })
        .catch(error => {
          console.error(error);

          document.getElementById("triagens").innerHTML = `
            <p style="color: red; text-align: center;">
              Erro ao carregar a fila de pacientes.
            </p>
          `;
        });
    }

    /**
     * Envia o paciente para a tela da TV.
     */
    function chamarNaTV(index) {
      const paciente = triagensCarregadas[index];

      if (!paciente || !paciente.nome) {
        alert("Paciente inválido.");
        return;
      }

      const consultorioInput =
        document.getElementById("consultorio-num");

      const consultorio =
        consultorioInput.value.trim() || "01";

      fetch("/tv/chamar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          localTipo: "CONSULTÓRIO",
          localNumero: consultorio,
          paciente: paciente.nome
        })
      })
        .then(response => {
          if (!response.ok) {
            throw new Error("Erro ao chamar o paciente na TV.");
          }

          return response.json();
        })
        .then(() => {
          alert(
            "✅ " +
            paciente.nome +
            " foi chamado na TV para o Consultório " +
            consultorio +
            "!"
          );
        })
        .catch(error => {
          console.error(error);
          alert("❌ Não foi possível chamar o paciente na TV.");
        });
    }

    function selecionar(index) {
      const paciente = triagensCarregadas[index];

      if (!paciente) {
        alert("Paciente não encontrado.");
        return;
      }

      document.getElementById("paciente").value =
        paciente.nome || "";

      document.getElementById("obs").value =
        paciente.observacao || "";

      if (
        paciente.alergia &&
        paciente.alergia !== "Nenhuma"
      ) {
        alert(
          "⚠️ Paciente possui alergia: " +
          paciente.alergia
        );
      }
    }

    function carregarMedicacoes() {
      fetch("/lista-medicacoes")
        .then(response => {
          if (!response.ok) {
            throw new Error(
              "Erro ao carregar a lista de medicações."
            );
          }

          return response.json();
        })
        .then(data => {
          const select =
            document.getElementById("medicacao");

          select.innerHTML = `
            <option value="">
              Selecione a medicação
            </option>
          `;

          if (!Array.isArray(data)) {
            return;
          }

          data.forEach(medicacao => {
            const option =
              document.createElement("option");

            option.value = medicacao;
            option.textContent = medicacao;

            select.appendChild(option);
          });
        })
        .catch(error => {
          console.error(error);

          alert(
            "❌ Não foi possível carregar as medicações."
          );
        });
    }

    function salvar() {
      const paciente =
        document.getElementById("paciente").value.trim();

      const diagnostico =
        document.getElementById("diagnostico").value.trim();

      const medicacao =
        document.getElementById("medicacao").value;

      const obs =
        document.getElementById("obs").value.trim();

      if (!paciente) {
        alert(
          "Selecione um paciente clicando em Atender."
        );
        return;
      }

      if (!diagnostico) {
        alert("Informe o diagnóstico.");
        return;
      }

      if (!medicacao) {
        alert("Selecione uma medicação.");
        return;
      }

      fetch("/consulta", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          paciente,
          diagnostico,
          medicacao,
          obs
        })
      })
        .then(response => {
          if (!response.ok) {
            throw new Error("Erro ao salvar a consulta.");
          }

          return response.json();
        })
        .then(() => {
          alert("✅ Consulta salva com sucesso!");

          document.getElementById("diagnostico").value = "";
          document.getElementById("medicacao").value = "";
          document.getElementById("obs").value = "";

          carregar();
        })
        .catch(error => {
          console.error(error);

          alert(
            "❌ Não foi possível salvar a consulta."
          );
        });
    }

    // Carregamento inicial
    carregar();
    carregarMedicacoes();

    // Atualiza a fila automaticamente a cada 10 segundos
    setInterval(carregar, 10000);
  </script>

</body>
</html>
