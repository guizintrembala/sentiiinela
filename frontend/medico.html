<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel Médico</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-tv:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
    }

    .consultorio-input label {
      font-weight: bold;
    }

    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .btn-alta {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-left: 8px;
    }

    .btn-alta:hover {
      background: #0056b3;
    }

    .btn-alta:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .botoes-consulta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .botoes-consulta button {
      cursor: pointer;
    }

    .card {
      margin-bottom: 12px;
    }

    .card-atendimento {
      border: 2px solid #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.25);
    }

    .mensagem-vazia {
      color: #888;
      text-align: center;
      padding: 20px;
    }

    .erro {
      color: #dc3545;
      background: #fff0f0;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #f5c2c7;
    }

    .risco {
      font-weight: bold;
    }

    .dados-paciente {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
      );
      gap: 12px;
      margin-bottom: 20px;
    }

    .campo-consulta {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .campo-consulta label {
      font-weight: bold;
      font-size: 14px;
    }

    .campo-consulta input,
    .campo-consulta textarea,
    .campo-consulta select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .campo-consulta textarea {
      min-height: 90px;
      resize: vertical;
    }

    .campo-grande {
      grid-column: 1 / -1;
    }

    .secao-consulta {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    .secao-consulta h4 {
      margin-top: 0;
      margin-bottom: 15px;
    }

  </style>

</head>

<body>

<div class="container">

  <header>

    <h1>Painel Médico</h1>

    <p>
      Atendimento e gerenciamento de pacientes
    </p>

  </header>


  <div
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      gap:10px;
      flex-wrap:wrap;
    "
  >

    <h2 style="margin:0;">
      🩺 Painel Médico
    </h2>

    <button
      type="button"
      class="btn-abrir-tv"
      onclick="abrirTV()"
    >
      📺 Abrir Tela da TV
    </button>

  </div>


  <!-- CONSULTÓRIO -->

  <div class="consultorio-input">

    <label for="consultorio-num">
      Meu Consultório:
    </label>

    <input
      type="text"
      id="consultorio-num"
      value="01"
      maxlength="2"
      inputmode="numeric"
      autocomplete="off"
    >

    <span
      style="
        color:#666;
        font-size:13px;
      "
    >
      Este número será exibido na TV ao chamar o paciente.
    </span>

  </div>


  <!-- FILA -->

  <h3>
    👥 Pacientes aguardando atendimento
  </h3>

  <div id="triagens"></div>


  <hr>


  <!-- CONSULTA -->

  <h3>
    🩺 Consulta
  </h3>


  <div class="secao-consulta">

    <h4>
      👤 Dados do paciente
    </h4>

    <div class="dados-paciente">

      <div class="campo-consulta">

        <label for="paciente">
          Paciente
        </label>

        <input
          id="paciente"
          placeholder="Paciente"
          readonly
        >

      </div>


      <div class="campo-consulta">

        <label for="dataNascimento">
          Data de nascimento
        </label>

        <input
          type="date"
          id="dataNascimento"
          name="dataNascimento"
          placeholder="Data de nascimento"
          autocomplete="bday"
        >

      </div>


      <div class="campo-consulta">

        <label for="cpf">
          CPF
        </label>

        <input
          type="text"
          id="cpf"
          name="cpf"
          placeholder="000.000.000-00"
          maxlength="14"
          inputmode="numeric"
          autocomplete="off"
        >

      </div>


      <div class="campo-consulta">

        <label for="telefone">
          Telefone
        </label>

        <input
          type="tel"
          id="telefone"
          name="telefone"
          placeholder="(00) 00000-0000"
          maxlength="15"
          inputmode="tel"
          autocomplete="tel"
        >

      </div>


      <div class="campo-consulta">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="email@exemplo.com"
          autocomplete="email"
        >

      </div>

    </div>

  </div>


  <!-- DADOS MÉDICOS -->

  <div class="secao-consulta">

    <h4>
      🩺 Informações do atendimento
    </h4>

    <div class="dados-paciente">

      <div class="campo-consulta campo-grande">

        <label for="diagnostico">
          Diagnóstico
        </label>

        <textarea
          id="diagnostico"
          placeholder="Informe o diagnóstico"
        ></textarea>

      </div>


      <div class="campo-consulta">

        <label for="medicacao">
          Medicação
        </label>

        <select id="medicacao">

          <option value="">
            Selecione a medicação
          </option>

        </select>

      </div>


      <div class="campo-consulta campo-grande">

        <label for="procedimento">
          Procedimento realizado
        </label>

        <textarea
          id="procedimento"
          placeholder="Descreva o procedimento realizado"
        ></textarea>

      </div>


      <div class="campo-consulta campo-grande">

        <label for="orientacoes">
          Orientações de alta
        </label>

        <textarea
          id="orientacoes"
          placeholder="Digite as orientações para o paciente"
        ></textarea>

      </div>


      <div class="campo-consulta campo-grande">

        <label for="obs">
          Observações
        </label>

        <textarea
          id="obs"
          placeholder="Observações"
        ></textarea>

      </div>

    </div>

  </div>


  <!-- RESPONSÁVEL -->

  <div class="secao-consulta">

    <h4>
      👨‍⚕️ Profissional responsável
    </h4>

    <div class="dados-paciente">

      <div class="campo-consulta">

        <label for="medico">
          Médico responsável
        </label>

        <input
          id="medico"
          placeholder="Nome do médico"
        >

      </div>


      <div class="campo-consulta">

        <label for="crm">
          CRM
        </label>

        <input
          id="crm"
          placeholder="CRM"
        >

      </div>

    </div>

  </div>


  <!-- BOTÕES -->

  <div class="botoes-consulta">

    <button
      type="button"
      onclick="salvar()"
    >
      💾 Salvar Consulta
    </button>


    <button
      type="button"
      class="btn-alta"
      id="btn-alta"
      onclick="darAlta()"
    >
      🏠 Dar Alta e Gerar PDF
    </button>

  </div>

</div>


<script>


// =====================================================
// VARIÁVEIS
// =====================================================

let triagensCarregadas = [];

let pacienteSelecionado = null;

let consultaSalvando = false;

let altaProcessando = false;

let tvChamando = false;


// =====================================================
// ESCAPAR HTML
// =====================================================

function escapeHTML(valor) {

  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// =====================================================
// ABRIR TV
// =====================================================

function abrirTV() {

  window.open(
    "tv.html",
    "_blank"
  );

}


// =====================================================
// CONSULTÓRIO
// =====================================================

function obterConsultorio() {

  let valor =
    document
      .getElementById("consultorio-num")
      .value
      .trim();

  if (!valor) {
    valor = "01";
  }

  valor =
    valor.replace(/\D/g, "");

  if (!valor) {
    valor = "01";
  }

  valor =
    valor.padStart(2, "0");

  const numero =
    parseInt(valor, 10);

  if (
    numero < 1 ||
    numero > 99
  ) {

    valor = "01";

  }

  document
    .getElementById("consultorio-num")
    .value = valor;

  return valor;

}


// =====================================================
// CARREGAR TRIAGENS
// =====================================================

async function carregar() {

  try {

    const response =
      await fetch(
        "/triagens",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "Erro HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    if (!Array.isArray(data)) {

      throw new Error(
        "O servidor retornou dados inválidos."
      );

    }

    triagensCarregadas = data;

    renderizarTriagens();

  }

  catch (error) {

    console.error(
      "Erro ao carregar triagens:",
      error
    );

    document
      .getElementById("triagens")
      .innerHTML = `
        <div class="erro">
          ❌ Não foi possível carregar os pacientes.
          <br>
          <small>
            ${escapeHTML(error.message)}
          </small>
        </div>
      `;

  }

}


// =====================================================
// RENDERIZAR TRIAGENS
// =====================================================

function renderizarTriagens() {

  const div =
    document.getElementById("triagens");

  div.innerHTML = "";

  if (
    triagensCarregadas.length === 0
  ) {

    div.innerHTML = `
      <div class="mensagem-vazia">
        Nenhum paciente na fila.
      </div>
    `;

    return;

  }


  triagensCarregadas.forEach(
    (t, index) => {

      const card =
        document.createElement("div");

      card.className =
        "card";


      if (
        pacienteSelecionado &&
        pacienteSelecionado.index === index
      ) {

        card.classList.add(
          "card-atendimento"
        );

      }


      const nome =
        escapeHTML(
          t.nome || "Paciente"
        );

      const sintoma =
        escapeHTML(
          t.sintoma || "Não informado"
        );

      const temperatura =
        escapeHTML(
          t.temperatura || "Não informada"
        );

      const risco =
        escapeHTML(
          t.risco || "Não informado"
        );

      const alergia =
        escapeHTML(
          t.alergia || "Nenhuma"
        );

      const observacao =
        escapeHTML(
          t.observacao || "Nenhuma"
        );


      card.innerHTML = `

        <h3>${nome}</h3>

        <p>
          <b>Sintoma:</b>
          ${sintoma}
        </p>

        <p>
          <b>Temperatura:</b>
          ${temperatura}°C
        </p>

        <p>
          <span class="risco">
            ${risco}
          </span>
        </p>

        <p>
          <b>Alergia:</b>
          ${alergia}
        </p>

        <p>
          <b>Observação:</b>
          ${observacao}
        </p>

        <div
          style="
            display:flex;
            gap:8px;
            flex-wrap:wrap;
          "
        >

          <button
            type="button"
            class="btn-atender"
          >
            👨‍⚕️ Atender
          </button>

          <button
            type="button"
            class="btn-tv"
          >
            📺 Chamar na TV
          </button>

        </div>

      `;


      card
        .querySelector(".btn-atender")
        .addEventListener(
          "click",
          () => selecionar(index)
        );


      card
        .querySelector(".btn-tv")
        .addEventListener(
          "click",
          () =>
            chamarNaTV(
              t.nome,
              card.querySelector(".btn-tv")
            )
        );


      div.appendChild(card);

    }
  );

}


// =====================================================
// CHAMAR NA TV
// =====================================================

async function chamarNaTV(
  nome,
  botao
) {

  if (tvChamando) {
    return;
  }

  const paciente =
    String(nome || "").trim();

  if (!paciente) {

    alert(
      "Nome do paciente inválido."
    );

    return;

  }

  const consultorio =
    obterConsultorio();

  tvChamando = true;

  if (botao) {

    botao.disabled = true;

    botao.textContent =
      "⏳ Chamando...";

  }


  try {

    const response =
      await fetch(
        "/tv/chamar",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            localTipo:
              "CONSULTÓRIO",

            localNumero:
              consultorio,

            paciente:
              paciente

          })

        }
      );


    let resultado = null;

    try {

      resultado =
        await response.json();

    }

    catch {

      resultado = null;

    }


    if (!response.ok) {

      throw new Error(
        resultado?.erro ||
        resultado?.message ||
        "Erro ao chamar paciente na TV."
      );

    }


    alert(
      "✅ " +
      paciente +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  }

  catch (error) {

    console.error(
      "Erro ao chamar paciente:",
      error
    );

    alert(
      "❌ Não foi possível chamar o paciente na TV.\n\n" +
      error.message
    );

  }

  finally {

    tvChamando = false;

    if (botao) {

      botao.disabled = false;

      botao.textContent =
        "📺 Chamar na TV";

    }

  }

}


// =====================================================
// LIMPAR FORMULÁRIO
// =====================================================

function limparFormulario() {

  document
    .getElementById("paciente")
    .value = "";

  document
    .getElementById("dataNascimento")
    .value = "";

  document
    .getElementById("cpf")
    .value = "";

  document
    .getElementById("telefone")
    .value = "";

  document
    .getElementById("email")
    .value = "";

  document
    .getElementById("diagnostico")
    .value = "";

  document
    .getElementById("medicacao")
    .value = "";

  document
    .getElementById("procedimento")
    .value = "";

  document
    .getElementById("orientacoes")
    .value = "";

  document
    .getElementById("obs")
    .value = "";

  document
    .getElementById("medico")
    .value = "";

  document
    .getElementById("crm")
    .value = "";

}


// =====================================================
// SELECIONAR PACIENTE
// =====================================================

async function selecionar(index) {

  const t =
    triagensCarregadas[index];

  if (!t) {

    alert(
      "Paciente não encontrado."
    );

    return;

  }


  pacienteSelecionado = {

    index: index,

    id:
      t.pacienteId ??
      t.id ??
      null,

    nome:
      t.nome

  };


  document
    .getElementById("paciente")
    .value =
    t.nome || "";


  document
    .getElementById("obs")
    .value =
    t.observacao || "";


  document
    .getElementById("diagnostico")
    .value = "";

  document
    .getElementById("medicacao")
    .value = "";

  document
    .getElementById("procedimento")
    .value = "";

  document
    .getElementById("orientacoes")
    .value = "";


  /*
   * Tenta buscar os dados completos
   * do paciente no cadastro.
   */

  if (t.pacienteId) {

    try {

      const response =
        await fetch(
          "/pacientes/" +
          encodeURIComponent(
            t.pacienteId
          ),
          {
            cache: "no-store"
          }
        );


      if (response.ok) {

        const paciente =
          await response.json();


        document
          .getElementById("paciente")
          .value =
          paciente.nome || t.nome || "";


        document
          .getElementById("dataNascimento")
          .value =
          paciente.dataNascimento || "";


        document
          .getElementById("cpf")
          .value =
          paciente.cpf || "";


        document
          .getElementById("telefone")
          .value =
          paciente.telefone || "";


        document
          .getElementById("email")
          .value =
          paciente.email || "";


        pacienteSelecionado.id =
          paciente.id;

      }

    }

    catch (error) {

      console.warn(
        "Não foi possível carregar os dados completos do paciente:",
        error
      );

    }

  }


  /*
   * Alerta de alergia.
   */

  if (
    t.alergia &&
    t.alergia !== "Nenhuma"
  ) {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }


  renderizarTriagens();


  document
    .getElementById("diagnostico")
    .focus();

}


// =====================================================
// CARREGAR MEDICAÇÕES
// =====================================================

async function carregarMedicacoes() {

  const select =
    document.getElementById(
      "medicacao"
    );


  try {

    const response =
      await fetch(
        "/lista-medicacoes",
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Erro HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (!Array.isArray(data)) {

      throw new Error(
        "Lista de medicações inválida."
      );

    }


    select.innerHTML = "";


    const primeiraOpcao =
      document.createElement(
        "option"
      );

    primeiraOpcao.value = "";

    primeiraOpcao.textContent =
      "Selecione a medicação";

    select.appendChild(
      primeiraOpcao
    );


    const nenhuma =
      document.createElement(
        "option"
      );

    nenhuma.value =
      "Nenhuma";

    nenhuma.textContent =
      "Nenhuma";

    select.appendChild(
      nenhuma
    );


    data.forEach(
      med => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          String(med);

        option.textContent =
          String(med);

        select.appendChild(
          option
        );

      }
    );

  }

  catch (error) {

    console.error(
      "Erro ao carregar medicações:",
      error
    );

    select.innerHTML = `
      <option value="">
        Erro ao carregar medicações
      </option>
    `;

  }

}


// =====================================================
// PEGAR DADOS DA CONSULTA
// =====================================================

function obterDadosConsulta() {

  return {

    paciente:
      document
        .getElementById("paciente")
        .value
        .trim(),

    pacienteId:
      pacienteSelecionado?.id ??
      null,

    dataNascimento:
      document
        .getElementById("dataNascimento")
        .value
        .trim(),

    cpf:
      document
        .getElementById("cpf")
        .value
        .trim(),

    telefone:
      document
        .getElementById("telefone")
        .value
        .trim(),

    email:
      document
        .getElementById("email")
        .value
        .trim(),

    diagnostico:
      document
        .getElementById("diagnostico")
        .value
        .trim(),

    medicacao:
      document
        .getElementById("medicacao")
        .value
        .trim(),

    procedimento:
      document
        .getElementById("procedimento")
        .value
        .trim(),

    orientacoes:
      document
        .getElementById("orientacoes")
        .value
        .trim(),

    obs:
      document
        .getElementById("obs")
        .value
        .trim(),

    medico:
      document
        .getElementById("medico")
        .value
        .trim(),

    crm:
      document
        .getElementById("crm")
        .value
        .trim()

  };

}


// =====================================================
// SALVAR CONSULTA
// =====================================================

async function salvar() {

  if (consultaSalvando) {
    return;
  }


  const dados =
    obterDadosConsulta();


  if (!dados.paciente) {

    alert(
      "⚠️ Selecione um paciente clicando em 'Atender'."
    );

    return;

  }


  if (!dados.diagnostico) {

    alert(
      "⚠️ Informe o diagnóstico."
    );

    document
      .getElementById("diagnostico")
      .focus();

    return;

  }


  if (!dados.medicacao) {

    alert(
      "⚠️ Selecione uma medicação ou escolha 'Nenhuma'."
    );

    return;

  }


  consultaSalvando = true;


  try {

    const response =
      await fetch(
        "/consulta",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify(
            dados
          )

        }
      );


    let resultado = null;

    try {

      resultado =
        await response.json();

    }

    catch {

      resultado = null;

    }


    if (!response.ok) {

      throw new Error(
        resultado?.erro ||
        resultado?.message ||
        "Erro ao salvar consulta."
      );

    }


    alert(
      "✅ Consulta salva com sucesso!"
    );


    document
      .getElementById("diagnostico")
      .value = "";

    document
      .getElementById("medicacao")
      .value = "";

    document
      .getElementById("procedimento")
      .value = "";

    document
      .getElementById("orientacoes")
      .value = "";

  }

  catch (error) {

    console.error(
      "Erro ao salvar consulta:",
      error
    );

    alert(
      "❌ Não foi possível salvar a consulta.\n\n" +
      error.message
    );

  }

  finally {

    consultaSalvando = false;

  }

}


// =====================================================
// DAR ALTA + PDF
// =====================================================

async function darAlta() {

  if (altaProcessando) {
    return;
  }


  const dados =
    obterDadosConsulta();


  if (!dados.paciente) {

    alert(
      "⚠️ Primeiro selecione um paciente em 'Atender'."
    );

    return;

  }


  if (!dados.diagnostico) {

    alert(
      "⚠️ Informe o diagnóstico antes de dar alta."
    );

    document
      .getElementById("diagnostico")
      .focus();

    return;

  }


  if (!dados.medicacao) {

    alert(
      "⚠️ Selecione uma medicação ou escolha 'Nenhuma'."
    );

    return;

  }


  const confirmar =
    confirm(
      "Deseja realmente dar alta para " +
      dados.paciente +
      " e gerar o PDF de alta?"
    );


  if (!confirmar) {
    return;
  }


  const novaAba =
    window.open(
      "",
      "_blank"
    );


  if (!novaAba) {

    alert(
      "⚠️ O navegador bloqueou a nova aba.\n\n" +
      "Permita pop-ups para este site e tente novamente."
    );

    return;

  }


  altaProcessando = true;


  const btnAlta =
    document.getElementById(
      "btn-alta"
    );


  btnAlta.disabled = true;

  btnAlta.textContent =
    "⏳ Gerando PDF...";


  try {

    const response =
      await fetch(
        "/alta",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify(
            dados
          )

        }
      );


    if (!response.ok) {

      let mensagem =
        "Erro ao gerar alta.";


      try {

        const erro =
          await response.json();

        mensagem =
          erro.erro ||
          erro.message ||
          mensagem;

      }

      catch {

        try {

          const texto =
            await response.text();

          if (texto) {
            mensagem = texto;
          }

        }

        catch {}

      }


      throw new Error(
        mensagem
      );

    }


    const blob =
      await response.blob();


    if (
      !blob ||
      blob.size === 0
    ) {

      throw new Error(
        "O servidor retornou um PDF vazio."
      );

    }


    const url =
      window.URL.createObjectURL(
        blob
      );


    novaAba.location.href =
      url;


    limparFormulario();


    pacienteSelecionado = null;


    await carregar();


    alert(
      "✅ Alta realizada com sucesso!"
    );


    setTimeout(
      () => {

        window.URL.revokeObjectURL(
          url
        );

      },
      60000
    );

  }

  catch (error) {

    console.error(
      "Erro ao gerar alta:",
      error
    );


    try {
      novaAba.close();
    }
    catch {}


    alert(
      "❌ Não foi possível gerar o PDF de alta.\n\n" +
      error.message
    );

  }

  finally {

    altaProcessando = false;

    btnAlta.disabled = false;

    btnAlta.textContent =
      "🏠 Dar Alta e Gerar PDF";

  }

}


// =====================================================
// FORMATAÇÃO DOS DADOS DO PACIENTE
// =====================================================

function formatarCPF(valor) {

  return valor
    .replace(/\D/g, "")
    .slice(0, 11)
    .replace(/(\d{3})(\d)/, "$1.$2")
    .replace(/(\d{3})(\d)/, "$1.$2")
    .replace(/(\d{3})(\d{1,2})$/, "$1-$2");

}


function formatarTelefone(valor) {

  const numeros =
    valor.replace(/\D/g, "").slice(0, 11);

  if (numeros.length <= 2) {
    return numeros.length ? `(${numeros}` : "";
  }

  if (numeros.length <= 6) {
    return `(${numeros.slice(0, 2)}) ${numeros.slice(2)}`;
  }

  if (numeros.length <= 10) {
    return `(${numeros.slice(0, 2)}) ${numeros.slice(2, 6)}-${numeros.slice(6)}`;
  }

  return `(${numeros.slice(0, 2)}) ${numeros.slice(2, 7)}-${numeros.slice(7)}`;

}


const campoCPF =
  document.getElementById("cpf");

const campoTelefone =
  document.getElementById("telefone");

if (campoCPF) {

  campoCPF.addEventListener("input", function () {
    this.value = formatarCPF(this.value);
  });

}

if (campoTelefone) {

  campoTelefone.addEventListener("input", function () {
    this.value = formatarTelefone(this.value);
  });

}

// INICIALIZAÇÃO
// =====================================================

async function inicializar() {

  await Promise.all([
    carregar(),
    carregarMedicacoes()
  ]);

}


inicializar();

setInterval(

    }

  },
  10000
);

</script>
