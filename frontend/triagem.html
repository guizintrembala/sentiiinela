<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Triagem | Hosp+</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    :root {
      --azul: #087ea4;
      --azul-escuro: #075b78;
      --azul-claro: #eaf7fb;

      --verde: #18a889;
      --verde-claro: #e9f8f4;

      --amarelo: #e7a900;
      --amarelo-claro: #fff7df;

      --vermelho: #d64545;
      --vermelho-claro: #fff0f0;

      --cinza-fundo: #f4f8fa;
      --cinza-borda: #dce7eb;
      --cinza-texto: #667980;

      --branco: #ffffff;

      --sombra: 0 8px 25px rgba(0, 70, 95, 0.09);
    }

    body {
      background:
        linear-gradient(135deg, #f7fcfd 0%, #eaf5f8 100%);

      min-height: 100vh;
      color: #263942;
    }

    /* =========================
       LAYOUT
       ========================= */

    .container {
      width: 94%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 28px 0 50px;
    }

    /* =========================
       CABEÇALHO
       ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      background: white;

      padding: 18px 24px;
      margin-bottom: 24px;

      border: 1px solid var(--cinza-borda);
      border-radius: 18px;

      box-shadow: var(--sombra);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--azul);
      color: white;

      border-radius: 14px;

      font-size: 28px;
      font-weight: 800;
    }

    .brand h1 {
      color: var(--azul-escuro);
      font-size: 25px;
      font-weight: 800;
    }

    .brand p {
      color: var(--cinza-texto);
      font-size: 13px;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* =========================
       BOTÕES
       ========================= */

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
