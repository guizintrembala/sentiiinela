
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triagem | Hosp+</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    :root {
      --azul: #087ea4;
      --azul-escuro: #075b78;
      --azul-claro: #eaf7fb;
      --verde: #18a889;
      --verde-claro: #e9f8f4;
      --amarelo: #e7a900;
      --amarelo-claro: #fff7df;
      --vermelho: #d64545;
      --vermelho-claro: #fff0f0;
      --cinza-fundo: #f4f8fa;
      --cinza-borda: #dce7eb;
      --cinza-texto: #667980;
      --branco: #ffffff;
      --sombra: 0 8px 25px rgba(0, 70, 95, 0.09);
    }

    body {
      background: linear-gradient(135deg, #f7fcfd, #eaf5f8);
      min-height: 100vh;
      color: #263942;
    }

    body.tv-aberta {
      overflow: hidden;
    }

    .container {
      width: 94%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 28px 0 50px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 18px 24px;
      margin-bottom: 24px;
      border: 1px solid var(--cinza-borda);
      border-radius: 18px;
      box-shadow: var(--sombra);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--azul);
      color: white;
      border-radius: 14px;
      font-size: 28px;
      font-weight: 800;
    }

    .brand h1 {
      color: var(--azul-escuro);
      font-size: 25px;
      font-weight: 800;
    }

    .brand p {
      color: var(--cinza-texto);
      font-size: 13px;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-tv {
      background: var(--azul);
      color: white;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn-tv:hover {
      background: var(--azul-escuro);
      transform: translateY(-1px);
    }

    .btn-atualizar {
      background: #edf3f5;
      color: #50636b;
      padding: 9px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 5px;
    }

    .btn-atualizar:hover {
      background: #dfe9ed;
    }

    .btn-salvar {
      width: 100%;
      background: linear-gradient(135deg, var(--azul), var(--azul-escuro));
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 8px;
      box-shadow: 0 5px 15px rgba(8, 126, 164, 0.2);
      transition: 0.2s;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: var(--branco);
      border: 1px solid var(--cinza-borda);
      border-radius: 20px;
      box-shadow: var(--sombra);
      overflow: hidden;
    }

    .card-header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--cinza-borda);
      background: #fbfdfe;
    }

    .card-header h2 {
      color: var(--azul-escuro);
      font-size: 19px;
      font-weight: 750;
    }

    .card-header p {
      color: var(--cinza-texto);
      font-size: 13px;
      margin-top: 5px;
    }

    .card-body {
      padding: 22px 24px;
    }

    .fila-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .fila-count {
      background: var(--azul-claro);
      color: var(--azul-escuro);
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 800;
    }

    #fila-pacientes {
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .fila-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      background: #f8fbfc;
      border: 1px solid var(--cinza-borda);
      border-radius: 13px;
      padding: 14px;
      margin-bottom: 10px;
      transition: 0.2s;
    }

    .paciente-info {
      min-width: 0;
    }

    .paciente-nome {
      display: block;
      color: #2c444d;
      font-size: 15px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .paciente-detalhes {
      display: block;
      color: #84959c;
      font-size: 12px;
      margin-top: 4px;
    }

    .btn-chamar {
      flex-shrink: 0;
      background: var(--verde);
      color: white;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .fila-vazia {
      text-align: center;
      padding: 35px 15px;
      color: #8999a0;
      font-size: 14px;
    }

    .fila-vazia-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .form-section {
      margin-bottom: 22px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--azul-escuro);
      font-size: 14px;
      font-weight: 750;
      margin-bottom: 13px;
    }

    .section-number {
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--azul-claro);
      color: var(--azul);
      border-radius: 50%;
      font-size: 12px;
      font-weight: 800;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #52666e;
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d5e2e6;
      background: #fbfdfe;
      color: #334950;
      border-radius: 10px;
      padding: 12px 13px;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--azul);
      background: white;
      box-shadow: 0 0 0 3px rgba(8, 126, 164, 0.10);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .resultado {
      display: none;
      margin-top: 18px;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .resultado.visivel {
      display: block;
    }

    .resultado.verde {
      background: var(--verde-claro);
      border: 1px solid #bde9de;
      color: #087b66;
    }

    .resultado.amarelo {
      background: var(--amarelo-claro);
      border: 1px solid #f2dda4;
      color: #9b7000;
    }

    .resultado.vermelho {
      background: var(--vermelho-claro);
      border: 1px solid #f0c4c4;
      color: #b52f2f;
    }

    #mensagem {
      display: none;
      margin-bottom: 18px;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    #mensagem.sucesso {
      display: block;
      background: var(--verde-claro);
      color: #087b66;
      border: 1px solid #bde9de;
    }

    #mensagem.erro {
      display: block;
      background: var(--vermelho-claro);
      color: #b52f2f;
      border: 1px solid #f0c4c4;
    }

    /* JANELA DA TV */

    #modalTV {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(15, 35, 45, 0.85);
      padding: 18px;
    }

    .tv-conteudo {
      position: relative;
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 14px;
      overflow: hidden;
    }

    #frameTV {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .btn-fechar-tv {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      padding: 10px 14px;
      border-radius: 9px;
      background: var(--vermelho);
      color: white;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 1000px) {
      .main-grid {
        grid-template-columns: 1fr;
      }

      #fila-pacientes {
        max-height: 350px;
      }
    }

    @media (max-width: 650px) {
      .container {
        width: 94%;
        padding-top: 15px;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
      }

      .header-actions,
      .btn-tv {
        width: 100%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .fila-item {
        align-items: flex-start;
        flex-direction: column;
      }

      .btn-chamar {
        width: 100%;
      }

      .paciente-nome {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">+</div>
        <div>
          <h1>Hosp+</h1>
          <p>Sistema de Atendimento Hospitalar</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="btn-tv" onclick="abrirTV()">
          📺 Abrir Tela da TV
        </button>
      </div>
    </header>

    <div id="mensagem" role="alert" aria-live="polite"></div>

    <div class="main-grid">

      <section class="card">
        <div class="card-header">
          <div class="fila-header">
            <div>
              <h2>Pacientes aguardando</h2>
              <p>Selecione um paciente para realizar a chamada.</p>
            </div>

            <div class="fila-count" id="fila-count"
                 aria-label="Quantidade de pacientes aguardando">0</div>
          </div>
        </div>

        <div class="card-body">
          <div id="fila-pacientes">
            <div class="fila-vazia">
              <div class="fila-vazia-icon">⏳</div>
              Carregando pacientes...
            </div>
          </div>

          <button type="button" id="btn-atualizar"
                  class="btn-atualizar" onclick="carregarPacientes()">
            🔄 Atualizar lista
          </button>
        </div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Triagem do paciente</h2>
          <p>Preencha as informações para registrar o atendimento.</p>
        </div>

        <div class="card-body">
          <div class="form-section">
            <div class="section-title">
              <span class="section-number">1</span>
              Dados do paciente
            </div>

            <div class="form-grid">
              <div class="field full">
                <label for="nome">Nome do paciente</label>
                <input id="nome" type="text" autocomplete="name"
                       placeholder="Digite o nome completo">
              </div>
            </div>
          </div>

          <div class="form-section">
            <div class="section-title">
              <span class="section-number">2</span>
              Queixa principal
            </div>

            <div class="form-grid">
              <div class="field">
                <label for="sintoma">Sintoma principal</label>
                <select id="sintoma">
                  <option value="">Selecione o sintoma</option>
                  <option value="dor_leve">Dor leve</option>
                  <option value="resfriado">Resfriado</option>
                  <option value="coriza">Coriza</option>
                  <option value="tosse">Tosse</option>
                  <option value="febre">Febre</option>
                  <option value="vomito">Vômito</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- A TV aparece sobre a página de triagem -->
  <div id="modalTV" role="dialog" aria-modal="true"
       aria-label="Tela de chamadas do Hosp+">
    <div class="tv-conteudo">
      <button type="button" class="btn-fechar-tv"
              onclick="fecharTV()">Fechar TV ✕</button>

      <iframe id="frameTV"
              title="Painel de chamadas do Hosp+"
              src="about:blank"></iframe>
    </div>
  </div>

  <script>
    "use strict";

    /*
      IMPORTANTE:
      Altere este caminho caso o arquivo da TV tenha outro nome.
      Exemplo: "/tv.html" ou "/chamadas.html".
    */
    const CAMINHO_TV = "/chamadas.html";

    function abrirTV() {
      const modal = document.getElementById("modalTV");
      const frame = document.getElementById("frameTV");

      if (!modal || !frame) {
        alert("Não foi possível encontrar a janela da TV.");
        return;
      }

      modal.style.display = "block";
      document.body.classList.add("tv-aberta");

      if (frame.dataset.carregada !== "true") {
        frame.src = CAMINHO_TV;
        frame.dataset.carregada = "true";
      }
    }

    function fecharTV() {
      const modal = document.getElementById("modalTV");
      if (modal) modal.style.display = "none";

      document.body.classList.remove("tv-aberta");
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        fecharTV();
      }
    });
  </script>
</body>
</html>
