
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamadas - Hosp+</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    :root {
      --azul: #087ea4;
      --azul-escuro: #075b78;
      --azul-claro: #eaf7fb;
      --verde: #18a889;
      --branco: #ffffff;
      --cinza: #f4f7f9;
      --cinza-texto: #60717a;
      --cinza-borda: #dce7eb;
      --sombra: 0 10px 30px rgba(0, 66, 91, 0.12);
    }

    body {
      background: linear-gradient(135deg, #f5fbfd, #e8f5f8);
      min-height: 100vh;
      overflow: hidden;
      color: #263942;
    }

    .tv-container {
      width: 94vw;
      height: 92vh;
      margin: auto;
      display: grid;
      grid-template-columns: minmax(0, 31fr) minmax(0, 69fr);
      gap: 22px;
      position: relative;
      top: 50%;
      transform: translateY(-50%);
    }

    .left-panel,
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
      min-height: 0;
    }

    .box {
      background: var(--branco);
      border: 1px solid var(--cinza-borda);
      border-radius: 24px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: var(--sombra);
      overflow: hidden;
      position: relative;
      min-width: 0;
    }

    .box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--azul), var(--verde));
    }

    .box-title {
      color: var(--cinza-texto);
      font-size: clamp(16px, 1.4vw, 26px);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .local-box {
      flex: 1;
      background: linear-gradient(145deg, #fff, #f2fafc);
    }

    .local-box .box-title {
      color: var(--azul);
    }

    .local-number {
      color: var(--azul-escuro);
      font-size: clamp(90px, 9vw, 180px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -5px;
    }

    .local-type {
      color: var(--cinza-texto);
      font-size: clamp(16px, 1.5vw, 28px);
      font-weight: 600;
      margin-top: 15px;
    }

    .history-box {
      flex: 1;
      justify-content: flex-start;
      align-items: stretch;
      padding: 28px 30px;
    }

    .history-box .box-title {
      align-self: center;
      margin-bottom: 20px;
    }

    #history-list {
      list-style: none;
      width: 100%;
      color: #405761;
      font-size: clamp(15px, 1.25vw, 22px);
      font-weight: 600;
      text-align: left;
    }

    #history-list li {
      display: flex;
      align-items: center;
      min-height: 48px;
      margin-bottom: 8px;
      padding: 10px 14px;
      background: var(--cinza);
      border-radius: 10px;
      border-left: 4px solid #b9dce5;
      overflow-wrap: anywhere;
    }

    #history-list li:first-child {
      background: var(--azul-claro);
      border-left-color: var(--azul);
      color: var(--azul-escuro);
    }

    .patient-box {
      flex: 3;
      min-height: 0;
      background:
        radial-gradient(circle at top right, rgba(24, 168, 137, 0.10), transparent 35%),
        linear-gradient(145deg, #fff, #f4fbfd);
    }

    .patient-box .box-title {
      color: var(--azul);
      font-size: clamp(18px, 1.7vw, 32px);
      margin-bottom: 25px;
    }

    .patient-name {
      width: 100%;
      color: #174c5d;
      font-size: clamp(42px, 5.5vw, 105px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -2px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .waiting-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
      color: #7a8b92;
      font-size: clamp(14px, 1.1vw, 20px);
      font-weight: 500;
    }

    .waiting-dot {
      flex: 0 0 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--verde);
      box-shadow: 0 0 0 5px rgba(24, 168, 137, 0.12);
    }

    .logo-box {
      flex: 1;
      flex-direction: row;
      justify-content: space-between;
      padding: 20px 35px;
      background: #fff;
    }

    .hospital-brand {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .hospital-icon {
      flex: 0 0 54px;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--azul);
      color: white;
      border-radius: 14px;
      font-size: 28px;
      font-weight: bold;
    }

    .logo-text {
      color: var(--azul-escuro);
      font-size: clamp(22px, 2.2vw, 42px);
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo-subtitle {
      color: #84959c;
      font-size: clamp(12px, 0.9vw, 18px);
      font-weight: 500;
    }

    .clock {
      color: #71848c;
      font-size: clamp(18px, 1.5vw, 28px);
      font-weight: 600;
      white-space: nowrap;
    }

    @keyframes chamada {
      0% {
        transform: scale(1);
        box-shadow: var(--sombra);
      }

      35% {
        transform: scale(1.015);
        box-shadow:
          0 0 0 8px rgba(8, 126, 164, 0.12),
          0 15px 40px rgba(0, 66, 91, 0.18);
      }

      70% {
        transform: scale(1.005);
      }

      100% {
        transform: scale(1);
        box-shadow: var(--sombra);
      }
    }

    .flash {
      animation: chamada 0.8s ease 3;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .tv-container {
        width: 94vw;
        height: auto;
        min-height: 94vh;
        top: auto;
        transform: none;
        margin: 3vh auto;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(280px, 38vh) minmax(320px, 1fr);
        gap: 15px;
      }

      .left-panel,
      .right-panel {
        gap: 15px;
      }

      .local-number {
        font-size: 15vw;
      }

      .patient-name {
        font-size: 9vw;
      }

      .logo-box {
        padding: 15px 20px;
      }

      .box {
        padding: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flash {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="tv-container">

    <section class="left-panel">
      <div class="box local-box">
        <div class="box-title" id="local-tipo">GUICHÊ</div>
        <div class="local-number" id="local-numero">--</div>
        <div class="local-type">Dirija-se ao local indicado</div>
      </div>

      <div class="box history-box">
        <div class="box-title">Últimas chamadas</div>
        <ul id="history-list">
          <li>Aguardando chamadas...</li>
        </ul>
      </div>
    </section>

    <section class="right-panel">
      <div class="box patient-box">
        <div class="box-title">Paciente chamado</div>
        <div class="patient-name" id="patient-name">
          AGUARDANDO...
        </div>

        <div class="waiting-indicator">
          <span class="waiting-dot"></span>
          <span>Por favor, dirija-se ao local indicado</span>
        </div>
      </div>

      <div class="box logo-box">
        <div class="hospital-brand">
          <div class="hospital-icon">+</div>

          <div>
            <div class="logo-text">Hosp+</div>
            <div class="logo-subtitle">
              Cuidar. Acolher. Transformar.
            </div>
          </div>
        </div>

        <div class="clock" id="clock">--:--</div>
      </div>
    </section>

  </main>

  <script>
    "use strict";

    let ultimoId = null;
    let buscandoChamada = false;

    const elementos = {
      localTipo: document.getElementById("local-tipo"),
      localNumero: document.getElementById("local-numero"),
      nomePaciente: document.getElementById("patient-name"),
      patientBox: document.querySelector(".patient-box"),
      historico: document.getElementById("history-list"),
      relogio: document.getElementById("clock")
    };

    function texto(valor, padrao = "--") {
      if (
        valor === null ||
        valor === undefined ||
        String(valor).trim() === ""
      ) {
        return padrao;
      }

      return String(valor);
    }

    function renderizarHistorico(historico) {
      const lista = elementos.historico;
      lista.replaceChildren();

      if (!historico.length) {
        const li = document.createElement("li");
        li.textContent = "Nenhuma chamada recente";
        lista.appendChild(li);
        return;
      }

      historico.slice(0, 4).forEach(chamada => {
        const li = document.createElement("li");

        const tipo = texto(
          chamada.localTipo,
          "GUIC"
        ).substring(0, 4);

        li.textContent =
          `${tipo}. ${texto(chamada.localNumero)} - ` +
          `${texto(chamada.paciente, "Paciente")}`;

        lista.appendChild(li);
      });
    }

    function renderizarChamada(chamada) {
      if (!chamada || typeof chamada !== "object") {
        ultimoId = null;

        elementos.localTipo.textContent = "GUICHÊ";
        elementos.localNumero.textContent = "--";
        elementos.nomePaciente.textContent = "AGUARDANDO...";

        elementos.patientBox.classList.remove("flash");
        return;
      }

      elementos.localTipo.textContent =
        texto(chamada.localTipo, "GUICHÊ");

      elementos.localNumero.textContent =
        texto(chamada.localNumero);

      elementos.nomePaciente.textContent =
        texto(chamada.paciente, "AGUARDANDO...");

      const idAtual = chamada.id ?? [
        chamada.paciente,
        chamada.localTipo,
        chamada.localNumero
      ].map(valor => texto(valor, "")).join("|");

      if (idAtual !== ultimoId) {
        ultimoId = idAtual;

        elementos.patientBox.classList.remove("flash");

        void elementos.patientBox.offsetWidth;

        elementos.patientBox.classList.add("flash");
      }
    }

    async function atualizar() {
      if (buscandoChamada) return;

      buscandoChamada = true;

      try {
        const resposta = await fetch("/tv/chamada", {
          method: "GET",
          headers: {
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        if (!resposta.ok) {
          throw new Error(`Erro HTTP ${resposta.status}`);
        }

        const data = await resposta.json();

        if (!data || typeof data !== "object") {
          throw new Error("Resposta inválida do servidor.");
        }

        renderizarChamada(data.chamada ?? null);

        renderizarHistorico(
          Array.isArray(data.historico)
            ? data.historico
            : []
        );

      } catch (erro) {
        console.error(
          "Erro ao atualizar chamadas:",
          erro
        );
      } finally {
        buscandoChamada = false;
      }
    }

    function atualizarRelogio() {
      const agora = new Date();

      const horas = String(
        agora.getHours()
      ).padStart(2, "0");

      const minutos = String(
        agora.getMinutes()
      ).padStart(2, "0");

      elementos.relogio.textContent =
        `${horas}:${minutos}`;
    }

    atualizar();
    atualizarRelogio();

    setInterval(atualizar, 2000);
    setInterval(atualizarRelogio, 1000);
  </script>
</body>
</html>
